<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClaUsina — Usuarios</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="fonts/clausina-icono-180.png">
<script>try{if(localStorage.getItem('clausina-mode')!=='light')document.documentElement.classList.add('dark');}catch(e){document.documentElement.classList.add('dark');}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Inter:wght@400;450;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tw.css">
<style>
  /* Variables locales espejadas de los tokens del sistema (tw.css), para que el modal, los
     inputs y los botones sigan el tema claro/oscuro como el resto del panel. Antes estaban
     hardcodeados en hex y en modo claro quedaban fuera de la paleta: el acento del sistema en
     claro es verde oliva (#4d6800), no el lima, que sólo funciona sobre fondo oscuro. */
  :root{--u-surf:#FFFFFF;--u-bg:#F7F5F1;--u-line:#DEDDD3;--u-fg:#0c0c0a;--u-mut:#5A616A;
        --u-acc:#4d6800;--u-accfg:#FFFFFF;--u-ok:#4d6800;--u-mal:#C4442A;--u-medio:#8A6410;}
  .dark{--u-surf:#12151A;--u-bg:#0c0c0a;--u-line:#20242B;--u-fg:#F5F2EC;--u-mut:#8A8F98;
        --u-acc:#CCF24D;--u-accfg:#0c0c0a;--u-ok:#7BC96F;--u-mal:#FF6B4A;--u-medio:#E8A33D;}
  .mtx{width:100%;border-collapse:separate;border-spacing:0;min-width:820px;}
  .mtx th,.mtx td{padding:14px 12px;text-align:left;border-bottom:1px solid var(--u-line);vertical-align:middle;}
  .mtx tbody tr:last-child td{border-bottom:0;}
  .mtx thead th{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;font-weight:400;white-space:nowrap;color:var(--u-mut);}
  .mtx tbody tr:hover{background:rgba(127,127,127,.06);}
  .pill{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:.62rem;padding:3px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;}
  /* Convención del panel: coral mientras falta algo, verde cuando terminó. */
  .p-admin,.p-ok{color:var(--u-ok);} .p-user{color:var(--u-mut);} .p-sin{color:var(--u-mal);}
  .p-medio{color:var(--u-medio);} .p-off{color:var(--u-mut);opacity:.6;}
  .iconbtn{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid var(--u-line);color:var(--u-mut);transition:.15s;background:none;cursor:pointer;}
  .iconbtn:hover{color:var(--u-fg);border-color:var(--u-fg);}
  .iconbtn:disabled{opacity:.35;cursor:default;}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;place-items:center;z-index:140;padding:20px;}
  .ov.on{display:grid;}
  .dlg{background:var(--u-surf);border:1px solid var(--u-line);border-radius:16px;padding:26px;width:min(560px,100%);max-height:88vh;overflow:auto;color:var(--u-fg);}
  label{display:block;font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--u-mut);margin:14px 0 6px;}
  input[type=text],input[type=email],input[type=password],select{width:100%;background:var(--u-bg);border:1px solid var(--u-line);border-radius:8px;padding:9px 11px;font-family:'Inter',sans-serif;font-size:.95rem;color:var(--u-fg);outline:none;}
  input:focus,select:focus{border-color:var(--u-acc);}
  .btn{background:var(--u-acc);color:var(--u-accfg);border:none;border-radius:8px;font-weight:700;padding:9px 18px;cursor:pointer;font-family:'Inter Tight',sans-serif;}
  .btn:disabled{opacity:.5;cursor:default;}
  .btn2{background:none;border:1px solid var(--u-line);color:var(--u-mut);border-radius:8px;padding:9px 18px;cursor:pointer;font-family:'Inter Tight',sans-serif;}
  .btn2:hover{color:var(--u-fg);border-color:var(--u-fg);}
  .negfila{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--u-line);}
  .negfila:last-child{border-bottom:0;}
  .negfila span{flex:1;font-size:.9rem;}
  .negfila select{width:auto;padding:5px 8px;font-size:.8rem;}
  .err{color:var(--u-mal);font-family:'JetBrains Mono',monospace;font-size:.7rem;margin-top:12px;min-height:1em;}
  /* El campo de contraseña necesita poder verse: escribir a ciegas una clave que después le
     dictás a alguien es la receta para un typo que nadie descubre hasta el primer login. */
  .pwrap{position:relative;}
  .pwrap input{padding-right:42px;}
  .pojo{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:grid;place-items:center;
        width:30px;height:30px;border:none;background:none;color:var(--u-mut);cursor:pointer;border-radius:6px;}
  .pojo:hover{color:var(--u-fg);}
  .pwmsg{font-family:'JetBrains Mono',monospace;font-size:.66rem;margin-top:8px;min-height:1.1em;}
  .pwmsg.mal{color:var(--u-mal);} .pwmsg.bien{color:var(--u-ok);}
</style>
</head>
<body class="bg-pbg dark:bg-bg text-pfg dark:text-fg antialiased">
<div class="shell">
  <main class="px-6 md:px-9 py-8 min-w-0">
    <div class="flex items-baseline gap-3 mb-1">
      <h1 class="display font-bold text-xl tracking-tight">Usuarios</h1>
      <span class="mono text-[11px] text-pmut dark:text-mut" id="sub">cargando…</span>
      <button class="iconbtn ml-auto" onclick="abrir()" title="Nuevo usuario" aria-label="Nuevo usuario">
        <i data-lucide="user-plus" class="w-4 h-4"></i>
      </button>
    </div>
    <p class="mono text-[11px] text-pmut dark:text-mut mb-7">
      El <b>administrador</b> ve toda la plataforma. El <b>aprobador</b> aprueba y publica en sus negocios;
      el <b>editor</b> prepara pero no aprueba.
    </p>

    <div class="rounded-2xl bg-psurf dark:bg-surf border border-pline dark:border-line card scrollx">
      <table class="mtx">
        <thead><tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Estado</th><th>Negocios</th><th></th></tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </main>
</div>

<div class="ov" id="ov" onclick="if(event.target===this)cerrar()">
  <div class="dlg">
    <h2 class="display font-bold text-lg tracking-tight" id="dlg-tit">Nuevo usuario</h2>
    <input type="hidden" id="f-id">
    <label for="f-nombre">Nombre</label>
    <input type="text" id="f-nombre" autocomplete="off">
    <label for="f-email">Email</label>
    <input type="email" id="f-email" autocomplete="off">
    <label for="f-pw" class="solo-edicion">Contraseña <span id="pw-nota" style="text-transform:none;letter-spacing:0"></span></label>
    <div class="pwrap solo-edicion">
      <input type="password" id="f-pw" autocomplete="new-password" placeholder="mínimo 8 caracteres" oninput="chequearPw()">
      <button type="button" class="pojo" onclick="verPw()" id="pw-ojo" title="Mostrar u ocultar" aria-label="Mostrar u ocultar la contraseña">
        <i data-lucide="eye" class="w-4 h-4"></i>
      </button>
    </div>
    <label for="f-pw2" class="solo-edicion">Repetir contraseña</label>
    <div class="pwrap solo-edicion">
      <input type="password" id="f-pw2" autocomplete="new-password" placeholder="escribila de nuevo" oninput="chequearPw()">
    </div>
    <div class="pwmsg solo-edicion" id="pw-msg"></div>
    <label for="f-rol">Rol de plataforma</label>
    <select id="f-rol" onchange="pintarNegocios()">
      <option value="usuario">Usuario de negocio</option>
      <option value="admin">Administrador de la plataforma</option>
    </select>
    <!-- El WhatsApp lo completa la propia persona en su primer ingreso: lo sabe mejor que
         nosotros. El chat de Telegram no se pide porque no es un dato que nadie conozca. -->
    <div id="bloque-contacto">
      <label for="f-wa">WhatsApp <span style="text-transform:none;letter-spacing:0">(lo completa la persona)</span></label>
      <input type="text" id="f-wa" placeholder="+54 9 11 ..." autocomplete="off">
    </div>
    <div id="bloque-neg">
      <label>Negocios que gestiona</label>
      <div id="f-neg"></div>
    </div>
    <div class="err" id="err"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px;">
      <button class="btn2" onclick="cerrar()">Cancelar</button>
      <button class="btn" id="btn-g" onclick="guardar()">Guardar</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="shell.js"></script>
<script>ClausinaShell({active:'usuarios'})</script>
<script>
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let USUARIOS = [], NEGOCIOS = [], YO = null;

function pillRol(u){
  if(u.rol_plataforma==='admin') return '<span class="pill p-admin">administrador</span>';
  if(!u.negocios || !u.negocios.length) return '<span class="pill p-sin">sin negocios</span>';
  return '<span class="pill p-user">usuario</span>';
}

/* Estado del onboarding, deducido de las tres marcas de tiempo que ya guardamos.
   Convención del panel: coral mientras falta algo, verde cuando terminó. */
function estadoDe(u){
  if(!u.activo)              return ['p-off','deshabilitado','Sin acceso. Podés volver a habilitarlo.'];
  if(u.perfil_completado_en) return ['p-ok','activo','Entró y completó su perfil'];
  if(u.ultimo_acceso_en)     return ['p-medio','sin completar','Entró pero no completó el perfil'];
  if(u.invitado_en)          return ['p-sin','invitado','Se le mandó la invitación pero nunca entró'];
  return ['p-sin','sin invitar','Todavía no se le mandó la invitación'];
}

function fila(u){
  const negs = (u.negocios||[]).map(n=>`${esc(n.slug)} · ${esc(n.rol)}`).join('<br>');
  const [cls, txt, tip] = estadoDe(u);
  const propio = YO && YO.id === u.id;   // no ofrecemos deshabilitarse a uno mismo
  return `<tr${u.activo?'':' style="opacity:.5"'}>
    <td><b>${esc(u.nombre)}</b>${u.activo?'':' <span class="pill p-off">inactivo</span>'}</td>
    <td class="mono text-[11px] text-pmut dark:text-mut">${esc(u.email)}</td>
    <td>${pillRol(u)}</td>
    <td><span class="pill ${cls}" title="${esc(tip)}">${txt}</span></td>
    <td class="mono text-[11px] text-pmut dark:text-mut">${u.rol_plataforma==='admin'?'todos':(negs||'—')}</td>
    <td style="text-align:right;white-space:nowrap">
      <button class="iconbtn" onclick="invitar('${u.id}')" title="Reenviar invitación por mail" aria-label="Reenviar invitación"><i data-lucide="send" class="w-4 h-4"></i></button>
      <button class="iconbtn" onclick="alternarActivo('${u.id}')" ${propio?'disabled title="No podés deshabilitarte a vos mismo"':`title="${u.activo?'Deshabilitar el acceso':'Volver a habilitar'}"`} aria-label="${u.activo?'Deshabilitar':'Habilitar'}"><i data-lucide="${u.activo?'user-x':'user-check'}" class="w-4 h-4"></i></button>
      <button class="iconbtn" onclick="abrir('${u.id}')" title="Editar" aria-label="Editar"><i data-lucide="pencil" class="w-4 h-4"></i></button>
    </td>
  </tr>`;
}

/* Reenvía la invitación por mail. Antes esto copiaba un texto al portapapeles — quedó de
   cuando el panel todavía no sabía mandar correo — y el nombre del botón mentía. */
async function invitar(id){
  const u = USUARIOS.find(x=>x.id===id); if(!u) return;
  const s = document.getElementById('sub'), antes = s.textContent;
  s.textContent = 'enviando invitación…';
  try{
    const r = await fetch(`api/usuarios/${id}/invitar`, {method:'POST'});
    const d = await r.json().catch(()=>({}));
    s.textContent = r.ok ? `invitación enviada a ${u.email}` : (d.mensaje || 'no se pudo enviar');
    if(r.ok) await cargar();
  }catch(_){ s.textContent = 'error de conexión'; }
  setTimeout(()=>{ s.textContent = antes; }, 5000);
}

/* Habilitar o deshabilitar. Deshabilitar corta la sesión abierta en el acto: el middleware
   recarga el usuario en cada request, así que la cookie firmada deja de valer. */
async function alternarActivo(id){
  const u = USUARIOS.find(x=>x.id===id); if(!u) return;
  const accion = u.activo ? 'deshabilitar' : 'habilitar';
  if(u.activo && !confirm(`¿Deshabilitar a ${u.nombre}?\n\nPierde el acceso en el acto, incluso si tiene una sesión abierta. Podés volver a habilitarlo cuando quieras.`)) return;
  const s = document.getElementById('sub'), antes = s.textContent;
  s.textContent = accion + '…';
  try{
    const r = await fetch(`api/usuarios/${id}`, {method:'PUT',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({activo: !u.activo})});
    const d = await r.json().catch(()=>({}));
    s.textContent = r.ok ? `${u.nombre} ${u.activo?'deshabilitado':'habilitado'}` : (d.mensaje||'no se pudo');
    if(r.ok) await cargar();
  }catch(_){ s.textContent='error de conexión'; }
  setTimeout(()=>{ s.textContent = antes; }, 4000);
}

function pintarNegocios(){
  // Un admin ve todos los negocios por definición: la asignación no aplica.
  const esAdmin = document.getElementById('f-rol').value === 'admin';
  document.getElementById('bloque-neg').style.display = esAdmin ? 'none' : '';
  if(esAdmin) return;
  const u = USUARIOS.find(x=>x.id===document.getElementById('f-id').value);
  const asignados = {};
  (u ? u.negocios||[] : []).forEach(n=>{ asignados[n.slug]=n.rol; });
  document.getElementById('f-neg').innerHTML = NEGOCIOS.map(n=>`
    <div class="negfila">
      <input type="checkbox" id="n-${esc(n.slug)}" data-slug="${esc(n.slug)}" ${asignados[n.slug]?'checked':''}>
      <span>${esc(n.nombre)}</span>
      <select id="r-${esc(n.slug)}">
        <option value="aprobador"${asignados[n.slug]==='aprobador'?' selected':''}>aprueba</option>
        <option value="editor"${asignados[n.slug]==='editor'?' selected':''}>edita</option>
      </select>
    </div>`).join('');
}

/* Mostrar/ocultar. Revela los dos campos a la vez: si sólo se viera uno, seguiría siendo a
   ciegas justo en el momento de compararlos. */
function verPw(){
  const a=document.getElementById('f-pw'), b=document.getElementById('f-pw2');
  const oculto = a.type==='password';
  a.type=b.type = oculto ? 'text' : 'password';
  document.getElementById('pw-ojo').innerHTML =
    `<i data-lucide="${oculto?'eye-off':'eye'}" class="w-4 h-4"></i>`;
  if(window.lucide) lucide.createIcons();
}

/* Compara mientras se escribe, así el error se ve antes de guardar y no después. */
function chequearPw(){
  const pw=document.getElementById('f-pw').value, pw2=document.getElementById('f-pw2').value;
  const m=document.getElementById('pw-msg');
  m.className='pwmsg';
  if(!pw && !pw2){ m.textContent=''; return true; }
  if(pw.length < 8){ m.classList.add('mal'); m.textContent=`Faltan ${8-pw.length} caracteres.`; return false; }
  if(!pw2){ m.classList.add('mal'); m.textContent='Repetila para confirmar.'; return false; }
  if(pw!==pw2){ m.classList.add('mal'); m.textContent='No coinciden.'; return false; }
  m.classList.add('bien'); m.textContent='Coinciden.'; return true;
}

function abrir(id){
  const u = id ? USUARIOS.find(x=>x.id===id) : null;
  document.getElementById('dlg-tit').textContent = u ? 'Editar usuario' : 'Nuevo usuario';
  document.getElementById('f-id').value    = u ? u.id : '';
  document.getElementById('f-nombre').value= u ? u.nombre : '';
  document.getElementById('f-email').value = u ? u.email : '';
  document.getElementById('f-email').disabled = !!u;   // el email identifica: no se cambia
  document.getElementById('f-pw').value    = '';
  document.getElementById('f-pw2').value   = '';
  // Al reabrir el diálogo los campos vuelven a estar ocultos: no dejamos una clave a la vista.
  document.getElementById('f-pw').type = document.getElementById('f-pw2').type = 'password';
  document.getElementById('pw-ojo').innerHTML = '<i data-lucide="eye" class="w-4 h-4"></i>';
  document.getElementById('pw-msg').textContent = '';
  document.getElementById('pw-msg').className = 'pwmsg';
  // Alta: sólo nombre, email y negocios. Todo lo demás lo completa la persona al entrar,
  // o el admin después si hace falta corregir algo.
  const nuevo = !u;
  document.querySelectorAll('.solo-edicion').forEach(x => { x.style.display = nuevo ? 'none' : ''; });
  document.getElementById('bloque-contacto').style.display = nuevo ? 'none' : '';
  document.getElementById('pw-nota').textContent = u ? '(dejala vacía para no cambiarla)' : '';
  document.getElementById('f-rol').value   = u ? u.rol_plataforma : 'usuario';
  document.getElementById('f-wa').value    = u ? (u.whatsapp||'') : '';
  document.getElementById('err').textContent = '';
  pintarNegocios();
  document.getElementById('ov').classList.add('on');
  if(window.lucide) lucide.createIcons();
}
function cerrar(){ document.getElementById('ov').classList.remove('on'); }

async function guardar(){
  const err = document.getElementById('err'), btn = document.getElementById('btn-g');
  err.textContent='';
  // No dejamos guardar con las contraseñas desparejas: sería fijar una clave que nadie sabe cuál es.
  if(!chequearPw()){ err.textContent='Revisá la contraseña antes de guardar.'; return; }
  btn.disabled=true;
  const id = document.getElementById('f-id').value;
  const rol = document.getElementById('f-rol').value;
  const negocios = rol==='admin' ? [] : NEGOCIOS
    .filter(n=>{ const c=document.getElementById('n-'+n.slug); return c && c.checked; })
    .map(n=>({ negocio_id:n.id, rol:document.getElementById('r-'+n.slug).value }));
  const body = {
    nombre: document.getElementById('f-nombre').value.trim(),
    rol_plataforma: rol,
    whatsapp: document.getElementById('f-wa').value.trim(),
    negocios,
  };
  const pw = document.getElementById('f-pw').value;
  if(pw) body.password = pw;
  if(!id){ body.email = document.getElementById('f-email').value.trim(); }
  try{
    const r = await fetch(id?('api/usuarios/'+id):'api/usuarios', {
      method: id?'PUT':'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body),
    });
    const d = await r.json().catch(()=>({}));
    if(!r.ok){ err.textContent = d.mensaje || 'No se pudo guardar.'; btn.disabled=false; return; }
    cerrar(); await cargar();
    // El alta no falla si el mail no sale: el usuario ya quedó creado y con acceso.
    const s = document.getElementById('sub'), antes = s.textContent;
    if(!id && d.invitacion && !d.invitacion.ok){
      s.textContent = 'usuario creado, pero la invitación no salió — reenviala con el botón';
    } else if(!id){
      s.textContent = 'usuario creado e invitación enviada';
    }
    if(!id) setTimeout(()=>{ s.textContent = antes; }, 5000);
  }catch(_){ err.textContent='Error de conexión.'; }
  btn.disabled=false;
}

async function cargar(){
  try{
    const [ru, rn, ry] = await Promise.all([fetch('api/usuarios'), fetch('api/negocios'), fetch('api/yo')]);
    YO = ry.ok ? await ry.json() : null;
    if(!ru.ok){ document.getElementById('sub').textContent = ru.status===403?'solo para administradores':'error'; return; }
    USUARIOS = (await ru.json()).usuarios || [];
    NEGOCIOS = (await rn.json()).negocios || [];
    document.getElementById('tb').innerHTML = USUARIOS.map(fila).join('');
    document.getElementById('sub').textContent = `${USUARIOS.length} usuario(s)`;
    if(window.lucide) lucide.createIcons();
  }catch(e){ document.getElementById('sub').textContent='error al cargar'; }
}
cargar();
</script>
</body>
</html>
