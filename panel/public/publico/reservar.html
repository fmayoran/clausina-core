<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reservar</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fuentes" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Inter:wght@400;450;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Página autocontenida a propósito: se sirve FUERA de la sesión del panel, donde los .js del
     panel no están disponibles. Tokens propios, del mismo sistema visual. */
  :root{--surf:#12151A;--bg:#0c0c0a;--line:#20242B;--fg:#F5F2EC;--mut:#8A8F98;
        --acc:#CCF24D;--accfg:#0c0c0a;--ok:#7BC96F;--mal:#FF6B4A;}
  @media (prefers-color-scheme: light){
    :root{--surf:#FFFFFF;--bg:#F7F5F1;--line:#DEDDD3;--fg:#0c0c0a;--mut:#5A616A;
          --acc:#4d6800;--accfg:#FFFFFF;--ok:#4d6800;--mal:#C4442A;}
  }
  /* Si el negocio declaró su modo, manda sobre el del visitante: la marca no cambia de color
     según el celular de quien la mira. */
  :root[data-modo="oscuro"]{--surf:#12151A;--bg:#0c0c0a;--line:#20242B;--fg:#F5F2EC;--mut:#8A8F98;
        --acc:#CCF24D;--accfg:#0c0c0a;--ok:#7BC96F;--mal:#FF6B4A;}
  :root[data-modo="claro"]{--surf:#FFFFFF;--bg:#F7F5F1;--line:#DEDDD3;--fg:#0c0c0a;--mut:#5A616A;
        --acc:#4d6800;--accfg:#FFFFFF;--ok:#4d6800;--mal:#C4442A;}
  :root{--f-tit:'Inter Tight',sans-serif;--f-txt:'Inter',system-ui,sans-serif;
        --f-mono:'JetBrains Mono',monospace;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-txt);
       line-height:1.55;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:560px;margin:0 auto;padding:32px 20px 60px;}
  .cab{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
  /* Fondo oscuro SIEMPRE, no var(--surf): el logo que guarda el perfil es la variante para
     fondo oscuro (el de Cortafuego es arte blanco sobre transparente) y en modo claro
     desaparecía. La solución de fondo es un par de logos claro/oscuro en el perfil. */
  .logo{width:52px;height:52px;border-radius:12px;object-fit:contain;background:#12151A;
        border:1px solid #20242B;padding:6px;flex:0 0 auto;}
  /* Con tokens propios el fondo lo define el negocio: el recuadro deja de imponer el suyo. */
  .logo.propio{background:var(--surf);border-color:var(--line);}
  h1{font-family:var(--f-tit);font-weight:700;font-size:1.5rem;margin:0;letter-spacing:-.01em;}
  .slogan{color:var(--mut);font-size:.9rem;margin:2px 0 0;}
  .sede{font-family:var(--f-mono);font-size:.66rem;color:var(--mut);margin:14px 0 26px;}
  .card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;}
  label{display:block;font-family:var(--f-mono);font-size:.6rem;letter-spacing:.12em;
        text-transform:uppercase;color:var(--mut);margin:0 0 7px;}
  input[type=text],input[type=tel],input[type=email],select,textarea{
    width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:11px 12px;
    font-family:var(--f-txt);font-size:1rem;color:var(--fg);outline:none;}
  input:focus,select:focus,textarea:focus{border-color:var(--acc);}
  textarea{min-height:72px;resize:vertical;}
  .fila{margin-bottom:16px;}
  .fila:last-child{margin-bottom:0;}
  .dos{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:460px){.dos{grid-template-columns:1fr;}}
  .dias{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;}
  .dchip{flex:0 0 auto;border:1px solid var(--line);background:none;border-radius:11px;
         padding:9px 12px;cursor:pointer;color:var(--fg);text-align:center;min-width:64px;}
  .dchip .dow{display:block;font-family:var(--f-mono);font-size:.55rem;
              text-transform:uppercase;letter-spacing:.1em;color:var(--mut);}
  .dchip .num{display:block;font-family:var(--f-tit);font-weight:700;font-size:1.05rem;}
  .dchip.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent);}
  .turnos{display:flex;flex-direction:column;gap:8px;}
  .tbtn{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:none;
        border-radius:11px;padding:12px 14px;cursor:pointer;color:var(--fg);text-align:left;width:100%;}
  .tbtn:hover{border-color:var(--fg);}
  .tbtn.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);}
  .tbtn b{font-family:var(--f-tit);font-weight:600;font-size:.98rem;}
  .tbtn .h{font-family:var(--f-mono);font-size:.66rem;color:var(--mut);}
  .tbtn .q{margin-left:auto;font-family:var(--f-mono);font-size:.62rem;color:var(--mut);}
  .btn{width:100%;background:var(--acc);color:var(--accfg);border:0;border-radius:11px;
       font-family:var(--f-tit);font-weight:700;font-size:1rem;padding:14px;cursor:pointer;}
  .btn:disabled{opacity:.45;cursor:default;}
  .invit .codfila{display:flex;gap:8px;align-items:center;}
  .invit .codfila input{flex:1;min-width:0;text-transform:uppercase;letter-spacing:.14em;
                        font-family:ui-monospace,monospace;}
  .invit .codfila .btn2{white-space:nowrap;}
  .codmsg{margin-top:9px;font-size:.86rem;line-height:1.5;min-height:1.2em;}
  .codmsg.si{color:#3d8b40;} .codmsg.no{color:#c4442a;}
  .invit.aplicada .codfila{display:none;}
  .chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;cursor:pointer;
       font-size:.84rem;color:var(--mut);text-transform:none;letter-spacing:0;}
  .chk input{width:auto;margin-top:3px;}
  .msg{font-family:var(--f-mono);font-size:.7rem;margin-top:12px;min-height:1em;color:var(--mal);}
  .nota{font-family:var(--f-mono);font-size:.58rem;color:var(--mut);margin-top:8px;line-height:1.6;}
  .oculto{display:none !important;}
  .ok{text-align:center;padding:20px 0;}
  .ok .tick{width:54px;height:54px;border-radius:50%;background:color-mix(in srgb,var(--ok) 18%,transparent);
            color:var(--ok);display:grid;place-items:center;margin:0 auto 16px;font-size:1.6rem;}
  .ok h2{font-family:var(--f-tit);font-size:1.2rem;margin:0 0 8px;}
  .ok p{color:var(--mut);font-size:.92rem;margin:0;}
  /* La dirección va al final: para reservar no hace falta, y arriba empujaba el formulario. */
  .sede{font-family:var(--f-mono);font-size:.66rem;color:var(--mut);margin:26px 0 0;text-align:center;line-height:1.7;}
  .volver{display:block;text-align:center;margin-top:20px;font-family:var(--f-mono);font-size:.66rem;
          color:var(--mut);text-decoration:none;}
  .volver:hover{color:var(--fg);}
  .pie{text-align:center;font-family:var(--f-mono);font-size:.56rem;
       color:var(--mut);opacity:.65;margin-top:26px;}
  .pie a{color:inherit;}
</style>
</head>
<body>
<div class="wrap">
  <div class="cab">
    <img class="logo oculto" id="logo" alt="">
    <div>
      <h1 id="nombre">…</h1>
      <p class="slogan oculto" id="slogan"></p>
    </div>
  </div>

  <div id="form">
    <!-- Arriba de todo y antes del formulario: si alguien llegó con una invitación, eso es lo
         que lo trajo. Enterarse de que el código no sirve DESPUÉS de cargar todo es la peor
         versión posible de esta pantalla. -->
    <div class="card invit oculto" id="invit">
      <div class="fila">
        <label for="cod">¿Tenés un código de invitación?</label>
        <div class="codfila">
          <input type="text" id="cod" inputmode="latin" autocapitalize="characters"
                 autocomplete="off" spellcheck="false" placeholder="ABC-123" maxlength="9">
          <button class="btn2" id="b-cod" onclick="validarCodigo()">Validar</button>
        </div>
        <div class="codmsg" id="codmsg"></div>
      </div>
    </div>

    <div class="card">
      <div class="fila">
        <label>Elegí el día</label>
        <div class="dias" id="dias"></div>
      </div>
      <div class="fila">
        <label>Elegí el turno</label>
        <div class="turnos" id="turnos"></div>
      </div>
      <div class="fila">
        <label id="lbl-cant">Cantidad</label>
        <input type="text" id="cantidad" inputmode="numeric" value="2">
      </div>
    </div>

    <div class="card">
      <div class="fila"><label for="nom">Tu nombre</label>
        <input type="text" id="nom" autocomplete="name"></div>
      <div class="fila"><label for="tel">Tu teléfono</label>
        <input type="tel" id="tel" autocomplete="tel" placeholder="11 5555-5555"></div>
      <div class="fila"><label for="notas">Algo que debamos saber <span style="text-transform:none;letter-spacing:0">(opcional)</span></label>
        <textarea id="notas"></textarea></div>
      <!-- Trampa para robots: una persona no la ve y no la completa. -->
      <div class="oculto"><label>No completar</label><input type="text" id="web" tabindex="-1" autocomplete="off"></div>
      <label class="chk" for="cons">
        <input type="checkbox" id="cons">
        Quiero recibir novedades y promociones. Es opcional: la reserva se hace igual.
      </label>
    </div>

    <button class="btn" id="enviar" onclick="enviar()">Reservar</button>
    <div class="msg" id="msg"></div>
    <div class="nota" id="nota"></div>
  </div>

  <div class="card oculto" id="listo">
    <div class="ok">
      <div class="tick">✓</div>
      <h2 id="ok-tit">Reserva registrada</h2>
      <p id="ok-txt"></p>
    </div>
  </div>

  <div class="sede oculto" id="sede"></div>
  <a class="volver oculto" id="volver">← Volver</a>
  <div class="pie">Reservas gestionadas con <a href="https://clausina.ar" target="_blank" rel="noopener">ClaUsina</a></div>
</div>

<script>
const SLUG = location.pathname.split('/')[2] || '';
const CLICK = new URLSearchParams(location.search).get('c') || '';
const UNI = { personas:['persona','personas'], cubiertos:['cubierto','cubiertos'],
              canchas:['cancha','canchas'], mesas:['mesa','mesas'],
              lugares:['lugar','lugares'], cupos:['cupo','cupos'] };
const DOW = ['dom','lun','mar','mié','jue','vie','sáb'];
let NEG = null, TURNOS = [], FECHA = null, TURNO = null;
// El código validado. Se manda con la reserva sólo si pasó por validarCodigo(): mandar uno a
// medio escribir haría fallar la reserva entera por un campo opcional.
let INVITACION = null;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const plural = n => (UNI[NEG.unidad] || UNI.personas)[n === 1 ? 0 : 1];

function pintarDias() {
  const fechas = [...new Set(TURNOS.map(t => t.fecha))].sort();
  if (!fechas.length) {
    $('dias').innerHTML = '<span class="nota">No hay días disponibles por ahora.</span>';
    return;
  }
  if (!FECHA || !fechas.includes(FECHA)) FECHA = fechas[0];
  $('dias').innerHTML = fechas.map(f => {
    const d = new Date(f + 'T12:00:00');
    return `<button class="dchip${f === FECHA ? ' on' : ''}" onclick="elegirDia('${f}')">
      <span class="dow">${DOW[d.getDay()]}</span><span class="num">${d.getDate()}</span></button>`;
  }).join('');
  pintarTurnos();
}
function elegirDia(f) { FECHA = f; TURNO = null; pintarDias(); }

function pintarTurnos() {
  const ts = TURNOS.filter(t => t.fecha === FECHA && t.libre > 0);
  if (!ts.length) {
    $('turnos').innerHTML = '<span class="nota">No queda lugar este día. Probá con otro.</span>';
    TURNO = null; actualizar(); return;
  }
  if (!TURNO || !ts.some(t => t.turno_id === TURNO)) TURNO = ts[0].turno_id;
  // Sin capacidad ni ocupación: al cliente le alcanza con que el turno esté ofrecido — los que
  // no tienen lugar ya vienen filtrados. Cuánto queda es información del negocio.
  $('turnos').innerHTML = ts.map(t => `
    <button class="tbtn${t.turno_id === TURNO ? ' on' : ''}" onclick="elegirTurno('${t.turno_id}')">
      <span><b>${esc(t.nombre)}</b><br><span class="h">${t.hora_desde}–${t.hora_hasta}</span></span>
    </button>`).join('');
  actualizar();
}
function elegirTurno(id) { TURNO = id; pintarTurnos(); }

function actualizar() {
  const t = TURNOS.find(x => x.fecha === FECHA && x.turno_id === TURNO);
  // El tope real considera lo que queda en el turno, pero no se dice cuánto queda: si el turno
  // está casi lleno, el número se ve al intentar reservar, no antes.
  const tope = Math.min(NEG.cantidad_max, t ? t.libre : NEG.cantidad_max);
  $('cantidad').max = tope;
  $('lbl-cant').textContent = 'Cantidad · ' + plural(2);
  $('nota').textContent = t ? 'La reserva ocupa el turno completo.' : '';
  $('enviar').disabled = !TURNO;
}

async function enviar() {
  const b = $('enviar'), m = $('msg');
  m.textContent = ''; b.disabled = true; b.textContent = 'Reservando…';
  const cuerpo = {
    turno_id: TURNO, fecha: FECHA, cantidad: parseInt($('cantidad').value, 10) || 0,
    cliente_nombre: $('nom').value, cliente_telefono: $('tel').value,
    notas: $('notas').value, consentimiento: $('cons').checked,
    web: $('web').value, click: CLICK,
    // Sólo se manda si quedó validado: mandar uno a medio escribir haría fallar la reserva entera.
    invitacion: INVITACION || undefined,
  };
  try {
    const r = await fetch(`/api/publico/${encodeURIComponent(SLUG)}/reserva`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) });
    const j = await r.json();
    if (r.ok && j.ok) {
      $('form').classList.add('oculto');
      $('listo').classList.remove('oculto');
      // Sin aviso automático todavía, así que la promesa se mantiene chica: se dice qué pasó,
      // no por qué canal ni cuándo va a llegar la respuesta. Cuando el aviso por WhatsApp esté
      // andando, acá se dice explícitamente que llega por ahí.
      $('ok-txt').textContent = j.estado === 'confirmada'
        ? 'Tu reserva quedó confirmada. Te esperamos.'
        : 'Recibimos tu pedido y ya lo tiene el negocio. Queda pendiente de confirmación.';
      if (j.estado !== 'confirmada') $('ok-tit').textContent = 'Reserva pedida';
      window.scrollTo(0, 0);
      return;
    }
    m.textContent = {
      sin_lugar: 'Se acaba de ocupar ese turno. Probá con otro.',
      cantidad_fuera: 'Esa cantidad no entra en una sola reserva.',
      muy_pronto: 'Falta muy poco para ese turno. Elegí uno más adelante.',
      muy_lejos: 'Todavía no se puede reservar tan adelante.',
      bloqueado: 'Ese día no está disponible.',
      sin_cliente: 'Necesitamos tu nombre y tu teléfono.',
      turno_no_aplica: 'Ese turno no corre ese día.',
      inv_agotada: 'Esa invitación ya se usó.',
      inv_vencida: 'Esa invitación ya venció.',
      inv_anulada: 'Esa invitación fue dada de baja.',
      inv_ajena: 'Esa invitación ya está en uso por otra persona.',
      inv_dia: 'La invitación no aplica al día que elegiste.',
      inv_turno: 'La invitación no aplica a ese turno.',
      inv_cantidad: 'La invitación no aplica para esa cantidad.',
      inv_no_existe: 'No encuentro ese código de invitación.',
      inv_forma: 'Ese código de invitación no es válido.',
      demasiados_intentos: 'Demasiados intentos. Probá en un rato.',
    }[j.error] || 'No pudimos tomar la reserva. Probá de nuevo.';
    if (j.error === 'sin_lugar') cargar();
  } catch (e) { m.textContent = 'No hay conexión. Probá de nuevo.'; }
  b.disabled = false; b.textContent = 'Reservar';
}

// Pinta la página con los tokens del negocio. Sin tokens no pasa nada: la paleta de ClaUsina
// es un default digno, no un error.
function aplicarMarca(m) {
  if (!m || !Object.keys(m).length) return;
  const r = document.documentElement.style;
  const set = (v, k) => { if (m[k]) r.setProperty(v, m[k]); };
  // El modo se fija: si el negocio es oscuro, no puede cambiar con el sistema del visitante.
  if (m.modo === 'oscuro' || m.modo === 'claro') {
    document.documentElement.dataset.modo = m.modo;
  }
  set('--bg', 'fondo'); set('--surf', 'superficie'); set('--line', 'linea');
  set('--fg', 'texto'); set('--mut', 'tenue');
  set('--acc', 'acento'); set('--accfg', 'acento_texto');
  // Las fuentes se piden a Google recién ahora, cuando se sabe cuáles son.
  const fams = [m.fuente_titulo, m.fuente_texto].filter(Boolean);
  if (fams.length) {
    const q = fams.map(f => 'family=' + encodeURIComponent(f).replace(/%20/g, '+') + ':wght@400;600;700').join('&');
    document.getElementById('fuentes').href =
      `https://fonts.googleapis.com/css2?${q}&family=JetBrains+Mono:wght@400;500&display=swap`;
    if (m.fuente_titulo) r.setProperty('--f-tit', `'${m.fuente_titulo}', sans-serif`);
    if (m.fuente_texto) r.setProperty('--f-txt', `'${m.fuente_texto}', system-ui, sans-serif`);
  }
}

/**
 * Valida el código contra el servidor y muestra QUÉ da. Se hace antes de pedir nada más: un
 * código que falla al final, después de que la persona eligió día, turno y cargó sus datos, la
 * deja con la sensación de haber perdido el tiempo — y probablemente sin reservar.
 */
async function validarCodigo() {
  const campo = $('cod'), msg = $('codmsg'), boton = $('b-cod');
  const codigo = campo.value.trim().toUpperCase();
  if (!codigo) { msg.className = 'codmsg'; msg.textContent = ''; INVITACION = null; return; }
  msg.className = 'codmsg'; msg.textContent = 'verificando…'; boton.disabled = true;
  try {
    const r = await fetch(`/api/publico/${encodeURIComponent(SLUG)}/invitacion/` +
                          encodeURIComponent(codigo));
    const j = await r.json();
    if (!r.ok || !j.ok) {
      INVITACION = null;
      msg.className = 'codmsg no';
      msg.textContent = j.mensaje || 'No pude verificar ese código.';
      return;
    }
    INVITACION = codigo;
    msg.className = 'codmsg si';
    // Se dice lo que da y, si tiene condiciones, cuáles: enterarse al reservar de que no aplica
    // ese día es el mismo problema corrido de lugar.
    const c = j.condiciones || {};
    const partes = [];
    if ((c.dias || []).length) partes.push('sólo ' + c.dias.map(d => DIAS_CORTOS[d]).join(', '));
    if (c.cantidad_max) partes.push('hasta ' + c.cantidad_max);
    msg.textContent = '✓ ' + j.texto + (partes.length ? ' — ' + partes.join(' · ') : '') +
      (j.vence_en ? ' · vence el ' + String(j.vence_en).slice(0, 10).split('-').reverse().join('/') : '');
    $('invit').classList.add('aplicada');
  } catch (e) {
    INVITACION = null; msg.className = 'codmsg no'; msg.textContent = 'No pude verificar ese código.';
  } finally { boton.disabled = false; }
}
const DIAS_CORTOS = { 1:'lunes', 2:'martes', 3:'miércoles', 4:'jueves', 5:'viernes', 6:'sábados', 7:'domingos' };

async function cargar() {
  try {
    const [rn, rd] = await Promise.all([
      fetch(`/api/publico/${encodeURIComponent(SLUG)}`),
      fetch(`/api/publico/${encodeURIComponent(SLUG)}/disponibilidad`),
    ]);
    if (!rn.ok) { $('nombre').textContent = 'No disponible'; return; }
    NEG = await rn.json();
    aplicarMarca(NEG.marca);
    document.title = 'Reservar en ' + NEG.nombre;
    $('nombre').textContent = NEG.nombre;
    if (NEG.slogan) { $('slogan').textContent = NEG.slogan; $('slogan').classList.remove('oculto'); }
    // Con tokens de marca el fondo lo pone el negocio, así que el recuadro se adapta en vez de
    // forzar oscuro. Si hay variante para fondo claro y el modo es claro, se usa esa.
    const claro = (NEG.marca || {}).modo === 'claro';
    const src = claro && NEG.logo_claro ? NEG.logo_claro : NEG.logo;
    if (src) {
      $('logo').src = src;
      if (NEG.marca && Object.keys(NEG.marca).length) $('logo').classList.add('propio');
      $('logo').classList.remove('oculto');
    }
    // El bloque del código se muestra siempre: cualquiera puede haber recibido una invitación
    // por otro lado. Si vino por /i/<codigo>, ya llega cargado y validado solo.
    $('invit').classList.remove('oculto');
    const traido = new URLSearchParams(location.search).get('inv');
    if (traido) { $('cod').value = traido.toUpperCase(); validarCodigo(); }

    // Volver: primero a quien nos trajo, si es otro sitio; si no, a la web del negocio.
    const ref = document.referrer && !document.referrer.includes(location.host) ? document.referrer : '';
    const destino = ref || (NEG.web ? (/^https?:/.test(NEG.web) ? NEG.web : 'https://' + NEG.web) : '');
    if (destino) {
      const v = $('volver');
      v.href = destino;
      try { v.textContent = '← Volver a ' + new URL(destino).hostname.replace(/^www\./, ''); }
      catch (_) { v.textContent = '← Volver'; }
      v.classList.remove('oculto');
    }
    if (NEG.sede) {
      const s = [NEG.sede.direccion, NEG.sede.localidad, NEG.sede.partido].filter(Boolean).join(' · ');
      if (s) { $('sede').textContent = s; $('sede').classList.remove('oculto'); }
    }
    $('cantidad').value = NEG.cantidad_min || 2;
    TURNOS = (await rd.json()).turnos || [];
    pintarDias();
  } catch (e) { $('nombre').textContent = 'No disponible'; }
}
cargar();
</script>
</body>
</html>
