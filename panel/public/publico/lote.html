<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pliego de invitaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fuentes" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;700;800&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* A6 exacto y sin márgenes: la imprenta recorta al borde, así que el sangrado lo pone el
     diseño y no el navegador. Una tarjeta por página, frente y dorso alternados, que es como
     se manda a imprimir a doble faz. */
  @page{size:A4;margin:0;}
  /* Cuatro A6 por A4 para cortar. El A4 mide 210×297 y el A6 105×148,5: entran exactos, así que
     las marcas de corte son las propias uniones. */
  :root{--f-tit:'Inter Tight',sans-serif;--f-txt:'Inter',sans-serif;
        --c-fondo:#101014;--c-tinta:#F5F2EC;--c-acento:#CCF24D;--c-linea:#2a2a33;}
  /* La base clara: la elige el beneficio y es la que ahorra tinta en papel común. */
  :root[data-tema="claro"]{--c-fondo:#FFFFFF;--c-tinta:#15150F;--c-acento:#B33A00;
                           --c-linea:#DCD8CC;}
  *{box-sizing:border-box;margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  body{background:#4a4a4a;font-family:var(--f-txt);overflow-x:hidden;}
  .hoja{width:210mm;height:297mm;display:grid;grid-template-columns:105mm 105mm;
        grid-template-rows:148.5mm 148.5mm;page-break-after:always;break-after:page;
        margin:0 auto 8mm;background:var(--c-linea);}
  /* Arriba y no centrado: con el título largo, la descripción y las condiciones, centrar hacía
     que el desborde se comiera el pie por abajo Y el logo por arriba. Así crece hacia abajo y el
     pie queda anclado al borde. */
  .cara{width:105mm;height:148.5mm;background:var(--c-fondo);color:var(--c-tinta);
        display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
        text-align:center;padding:8mm 7mm;position:relative;overflow:hidden;}
  /* Un hueco cuando la tanda no llena la hoja: hay que ocupar la celda igual para que las
     posiciones del dorso sigan calzando con las del frente. */
  .cara.hueca{background:#fff;}
  :root[data-tema="claro"] .rotulo,
  :root[data-tema="claro"] .cond,
  :root[data-tema="claro"] .otra{opacity:.88;}
  :root[data-tema="claro"] .pie{opacity:.72;}
  :root[data-tema="claro"] .beneficio,
  :root[data-tema="claro"] .para{opacity:1;}
  /* El frente: si el negocio tiene una pieza gráfica se usa esa; si no, el logo sobre su color. */
  .frente{padding:0;}
  .frente img{width:100%;height:100%;object-fit:cover;display:block;}
  .frente .fallback{display:flex;flex-direction:column;align-items:center;justify-content:center;
                    gap:7mm;width:100%;height:100%;padding:12mm;}
  .frente .fallback img{width:auto;max-width:70%;max-height:34mm;object-fit:contain;}
  .frente .lema{font-family:var(--f-tit);font-weight:800;font-size:7.4mm;line-height:1.08;
                text-transform:uppercase;color:var(--c-acento);}
  .logo{max-height:16mm;max-width:70%;width:auto;margin-bottom:5mm;}
  /* El logo del negocio está pensado para fondo oscuro: sobre papel blanco se borra. */
  .banda{background:var(--c-marca-fondo,#101014);border-radius:3mm;padding:4mm 5mm;
         margin-bottom:7mm;display:inline-block;max-width:86%;}
  .banda .logo{margin:0;max-width:100%;}
  .frente .fallback .banda{margin:0;}
  /* Con el nombre de la campaña adentro el título ya no es una línea fija: baja un punto y se
     lo deja partir, antes que desbordar la tarjeta. */
  .titulo{font-family:var(--f-tit);font-weight:800;font-size:5.4mm;line-height:1.1;
          text-transform:uppercase;color:var(--c-acento);text-wrap:balance;}
  .detalle{font-size:3.1mm;font-weight:700;line-height:1.4;opacity:.9;margin-top:2mm;
           white-space:pre-wrap;}
  /* El monto en el acento de la marca: es el dato por el que la persona guarda la tarjeta. */
  .beneficio{font-family:var(--f-tit);font-weight:700;font-size:4.6mm;line-height:1.25;
             margin:2.5mm 0 0;color:var(--c-acento);}
  .para{font-size:3.6mm;opacity:.75;margin-top:1.5mm;}
  .codigo{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:8mm;
          letter-spacing:.12em;padding:3.5mm 3mm;border:.4mm dashed var(--c-linea);
          border-radius:3mm;margin:5mm 0 2mm;width:100%;}
  .rotulo{font-family:'JetBrains Mono',monospace;font-size:2.4mm;letter-spacing:.22em;
          text-transform:uppercase;opacity:.6;}
  .cond{font-family:'JetBrains Mono',monospace;font-size:2.6mm;line-height:1.7;opacity:.72;
        margin-top:3mm;}
  /* En papel esto reemplaza al botón: es el único camino para reservar, así que se lee. */
  .otra{font-family:'JetBrains Mono',monospace;font-size:2.9mm;line-height:1.65;opacity:.85;
        margin-top:4mm;}
  .otra b{font-size:3.6mm;letter-spacing:.04em;color:var(--c-acento);}
  .pie{font-family:'JetBrains Mono',monospace;font-size:2.1mm;opacity:.5;line-height:1.6;
       margin-top:auto;padding-top:4mm;}
  /* Barra de control: sólo en pantalla. */
  .ctrl{position:sticky;top:0;z-index:5;background:#17171b;color:#eee;padding:12px 16px;
        display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:.86rem;
        font-family:'JetBrains Mono',monospace;}
  .ctrl select{max-width:min(260px,42vw);}
  .ctrl button,.ctrl select{background:none;border:1px solid #444;color:#eee;border-radius:7px;
        padding:7px 13px;cursor:pointer;font-family:inherit;font-size:.82rem;}
  .ctrl button.p{background:#CCF24D;color:#111;border-color:#CCF24D;font-weight:700;}
  .ctrl .nota{opacity:.6;}
  .ctrl .nota b{opacity:1;color:#CCF24D;}
  @media print{ .ctrl{display:none !important;} body{background:#fff;} .hoja{margin:0;} }
</style>
</head>
<body>
<div class="ctrl">
  <span id="cuenta">cargando…</span>
  <label>Frente:
    <select id="sel-frente" onchange="pintar()"><option value="">logo del negocio</option></select>
  </label>
  <button class="p" onclick="window.print()">Imprimir / Guardar PDF</button>
  <span class="nota">A4 · 4 por hoja · <b>doble faz girando por el borde largo</b></span>
</div>
<div id="hojas"></div>

<script>
const $ = id => document.getElementById(id);
const CODIGOS = decodeURIComponent(location.pathname.split('/').pop() || '')
  .split(',').map(s => s.trim()).filter(Boolean);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fecha = iso => String(iso || '').slice(0, 10).split('-').reverse().join('/');
let PASES = [], PIEZAS = [];

function marca(m, claro) {
  if (!m || !Object.keys(m).length) return;
  const r = document.documentElement.style;
  // Los nombres los pone la identidad del negocio: 'texto', no 'tinta'.
  const set = (v, k) => { if (m[k]) r.setProperty(v, m[k]); };
  if (m.fondo) r.setProperty('--c-marca-fondo', m.fondo);
  set('--c-acento', 'acento');
  // En claro la marca aporta el acento y las tipografías; el resto lo pone la base.
  if (!claro) { set('--c-fondo', 'fondo'); set('--c-tinta', 'texto'); set('--c-linea', 'linea'); }
  const fams = [m.fuente_titulo, m.fuente_texto].filter(Boolean);
  if (fams.length) {
    const q = fams.map(f => 'family=' + encodeURIComponent(f).replace(/%20/g, '+') + ':wght@400;600;700').join('&');
    const l = document.getElementById('fuentes');
    if (l) l.href = `https://fonts.googleapis.com/css2?${q}&family=JetBrains+Mono:wght@500;700&display=swap`;
    if (m.fuente_titulo) r.setProperty('--f-tit', `'${m.fuente_titulo}', sans-serif`);
    if (m.fuente_texto) r.setProperty('--f-txt', `'${m.fuente_texto}', sans-serif`);
  }
}

function condiciones(j) {
  const l = [...((j.condiciones || {}).frases || [])];
  if (j.vence_en) l.push('Vence el ' + fecha(j.vence_en));
  // Cuántos usos quedan es un dato de gestión; en papel invita a contar y a llegar último.
  if (j.usos_max > 1) l.push('Cupos limitados');
  return l.join('<br>');
}

/** El logo que se ve sobre la base elegida, y si hace falta apoyarlo en su propio fondo. */
function logoDe(j, clase) {
  const claro = (j.tema || 'claro') === 'claro';
  const src = claro && j.logo_claro ? j.logo_claro : j.logo;
  if (!src) return '';
  const img = `<img class="${clase}" src="${esc(src)}" alt="">`;
  return (claro && !j.logo_claro) ? `<span class="banda">${img}</span>` : img;
}

function caraFrente(j, pieza) {
  return pieza
    ? `<div class="cara frente"><img src="${esc(pieza)}" alt=""></div>`
    : `<div class="cara frente"><div class="fallback">
         ${logoDe(j, '')}
         <div class="lema">Invitación especial</div></div></div>`;
}

function caraDorso(j) {
  const wa = j.whatsapp ? j.whatsapp.replace(/[^0-9+ -]/g, '') : '';
  const sede = j.sede ? [j.sede.direccion, j.sede.localidad].filter(Boolean).join(', ') : '';
  return `<div class="cara">
      ${logoDe(j, 'logo')}
      <div class="titulo">Invitación especial${j.nombre ? ' · ' + esc(j.nombre) : ''}</div>
      ${j.descripcion ? `<div class="detalle">${esc(j.descripcion)}</div>` : ''}
      <div class="beneficio">${esc(j.texto)}</div>
      ${j.etiqueta ? `<div class="para">Para ${esc(j.etiqueta)}</div>` : ''}
      <div class="codigo">${esc(j.codigo.replace(/^(.{3})(.{3})$/, '$1-$2'))}</div>
      <div class="rotulo">Presentá este código al reservar</div>
      <div class="cond">${condiciones(j)}</div>
      ${wa ? `<div class="otra">Reservá por WhatsApp<br><b>${esc(wa)}</b><br>y decinos tu código</div>`
           : `<div class="otra">Reservá en ${esc(j.web || j.negocio_slug + '.ar')}</div>`}
      <div class="pie">
        <b>Con reserva previa.</b> Sin reserva no podemos garantizarte lugar.<br>
        Presentá esta invitación al llegar para validarla · El descuento se aplica al pagar
        ${sede || j.instagram ? '<br>' + [sede, j.instagram].filter(Boolean).map(esc).join(' · ') : ''}
      </div>
    </div>`;
}

const HUECA = '<div class="cara hueca"></div>';

function pintar() {
  // Vacío = lo que indicó el beneficio de cada invitación. El desplegable es para forzar otra,
  // no para tener que elegirla cada vez.
  const forzada = $('sel-frente').value;
  const porHoja = 4;
  let html = '';
  for (let i = 0; i < PASES.length; i += porHoja) {
    const tanda = PASES.slice(i, i + porHoja);
    const frentes = tanda.map(j => caraFrente(j, forzada || j.frente));
    // EL DORSO VA ESPEJADO. Al imprimir a doble faz por el borde largo, la hoja gira sobre su eje
    // vertical: lo que estaba a la izquierda queda a la derecha. Sin intercambiar las columnas,
    // cada dorso cae detrás de OTRA tarjeta y la tirada entera se tira.
    const dorsos = tanda.map(j => caraDorso(j));
    const espejado = [dorsos[1], dorsos[0], dorsos[3], dorsos[2]];
    html += `<div class="hoja">${frentes.concat(Array(porHoja).fill(HUECA)).slice(0, porHoja).join('')}</div>`;
    html += `<div class="hoja">${espejado.map(x => x || HUECA).join('')}</div>`;
  }
  $('hojas').innerHTML = html;
  const hojas = Math.ceil(PASES.length / porHoja) * 2;
  $('cuenta').textContent = `${PASES.length} invitación(es) · ${hojas} hoja(s) A4`;
}

(async () => {
  const rs = await Promise.all(CODIGOS.map(c =>
    fetch('/api/publico/pase/' + encodeURIComponent(c)).then(r => r.json()).catch(() => null)));
  PASES = rs.filter(j => j && j.ok);
  if (!PASES.length) { $('cuenta').textContent = 'No hay invitaciones para imprimir.'; return; }
  // Todas las invitaciones de un pliego salen del mismo beneficio en la práctica; si se mezclan,
  // manda la primera: una hoja no puede tener dos bases distintas.
  const claro = (PASES[0].tema || 'claro') === 'claro';
  if (claro) document.documentElement.dataset.tema = 'claro';
  marca(PASES[0].marca, claro);

  // Piezas gráficas del negocio para usar de frente. Es opcional: sin ninguna, va el logo.
  try {
    const p = await fetch('/api/publico/' + encodeURIComponent(PASES[0].negocio_slug) + '/piezas')
      .then(r => r.json());
    PIEZAS = p.piezas || [];
    // La primera opción dice qué pasa si no se elige nada: la pieza que el beneficio indicó,
    // o el logo si no indicó ninguna. Un "logo del negocio" cuando en realidad va a salir G-0006
    // haría desconfiar de lo que se está por mandar a imprimir.
    const propio = PASES.find(j => j.frente_codigo);
    $('sel-frente').innerHTML =
      `<option value="">${propio ? 'la del beneficio (' + esc(propio.frente_codigo) + ')' : 'logo del negocio'}</option>` +
      PIEZAS.map(x => `<option value="${esc(x.url)}">${esc(x.codigo)} · ${esc(x.titulo)}</option>`).join('');
  } catch (e) {}
  pintar();
})();
</script>
</body>
</html>
