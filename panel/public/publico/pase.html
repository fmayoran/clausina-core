<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invitación</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fuentes" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;700;800&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Los tokens los pisa la marca del negocio, igual que en la página de reservas: el pase es del
     negocio, no de ClaUsina. Sin marca cargada, cae en una paleta neutra. */
  :root{--f-tit:'Inter Tight',sans-serif;--f-txt:'Inter',sans-serif;
        --c-fondo:#101014;--c-tinta:#F5F2EC;--c-acento:#CCF24D;--c-suave:#1b1b21;--c-linea:#2a2a33;
        --c-filete:rgba(255,255,255,.34);}
  /* La otra base. El beneficio elige cuál: en papel el blanco gana casi siempre, y el acento
     de la marca es lo único que se conserva de su paleta. */
  :root[data-tema="claro"]{--c-fondo:#F2F0EA;--c-tinta:#15150F;--c-acento:#B33A00;
                           --c-suave:#FFFFFF;--c-linea:#DCD8CC;--c-filete:rgba(0,0,0,.3);}
  *{box-sizing:border-box;margin:0;}
  /* Los colores se imprimen sí o sí. Sin esto depende de que quien imprime tenga tildado
     "gráficos de fondo", y la tarjeta sale en blanco y negro sin que nadie se entere. */
  html{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  body{background:var(--c-fondo);color:var(--c-tinta);font-family:var(--f-txt);
       min-height:100vh;display:grid;place-items:center;padding:26px 18px;}
  .pase{width:min(430px,100%);background:var(--c-suave);border:1px solid var(--c-linea);
        border-radius:20px;padding:30px 28px 26px;text-align:center;position:relative;overflow:hidden;}
  .envoltorio{width:min(430px,100%);}
  .caras{display:flex;flex-direction:column;}
  .col{min-width:0;}
  /* Las dos caras son la MISMA pieza: tienen que medir lo mismo. El dorso lleva el doble de
     contenido que el frente, así que en vez de achicarle la tipografía —que desarma el diseño—
     se lo muestra a escala, igual que mirar la tarjeta de verdad desde más lejos. El alto lo fija
     el marco y adentro la pieza se dibuja entera. */
  .marco{position:relative;width:100%;overflow:hidden;}
  .marco > .pase{position:absolute;top:0;left:0;transform-origin:top left;}
  /* Con ancho suficiente, las dos caras se ven juntas: es una pieza de dos caras, no dos piezas
     apiladas. El corte está donde dejan de entrar dos tarjetas de 430 con aire en el medio. */
  @media screen and (min-width:980px){
    .envoltorio{width:auto;max-width:none;}
    .caras{flex-direction:row;align-items:flex-start;justify-content:center;gap:30px;}
    .col{width:430px;flex:0 0 auto;}
  }
  /* La invitación tiene dos caras: el frente es la pieza gráfica que eligió el beneficio y el
     dorso es este pase. Mostrar sólo el dorso hace parecer que el frente no se guardó. */
  .frente{width:100%;border:1px solid var(--c-linea);border-radius:20px;overflow:hidden;
          margin-bottom:16px;background:var(--c-suave);line-height:0;}
  .frente img{width:100%;height:auto;display:block;}
  /* La foto montada sobre la base, no a sangre: el margen y el filo la encuadran y le dan
     presencia de invitación. Un filete DENTRO de la foto chocaría con la banda de datos que la
     pieza gráfica ya trae abajo. */
  .frente{padding:2mm;background:var(--c-suave);}
  .frente img{border:1px solid var(--c-filete);}
  /* El dorso lleva el mismo filete: una tarjeta clara sobre papel blanco, sin borde, no muestra
     dónde termina. En pantalla acompaña el redondeo de la tarjeta. */
  .pase::after{content:'';position:absolute;inset:8px;border:1px solid var(--c-filete);
               border-radius:13px;pointer-events:none;}
  .cara-rot{font-family:'JetBrains Mono',monospace;font-size:.58rem;letter-spacing:.22em;
            text-transform:uppercase;opacity:.5;text-align:center;margin:0 0 7px;line-height:1.6;}
  /* El logo manda: es lo primero y lo más grande, y trae el nombre adentro. */
  .logo{max-height:104px;max-width:86%;width:auto;margin:0 auto 24px;display:block;}
  /* El logo de un negocio suele ser una sola pieza, pensada para fondo oscuro: sobre papel
     blanco se borra. Sin variante clara cargada, se lo apoya en su propio fondo. */
  .banda{background:var(--c-marca-fondo,#101014);border-radius:12px;padding:18px 24px;
         margin:0 auto 24px;display:inline-block;max-width:92%;}
  .banda .logo{margin:0;max-width:100%;}
  .titulo{font-family:var(--f-tit);font-weight:800;font-size:1.5rem;line-height:1.1;
          letter-spacing:.02em;text-transform:uppercase;color:var(--c-acento);}
  /* El beneficio es lo que se lee de un vistazo: después del logo, es lo más grande de la pieza. */
  /* El monto en el acento de la marca: es el dato por el que la persona guarda la tarjeta. */
  .beneficio{font-family:var(--f-tit);font-weight:700;font-size:1.6rem;line-height:1.25;
             margin:12px 0 4px;color:var(--c-acento);}
  .rotulo{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.24em;
          text-transform:uppercase;opacity:.62;}
  .para{font-size:.9rem;opacity:.75;margin-bottom:20px;}
  /* Lo que el nombre y el monto no dicen: qué incluye, qué no, cómo se usa. Lo escribe el
     negocio en el beneficio. */
  .detalle{font-size:.86rem;font-weight:700;line-height:1.5;opacity:.9;margin-top:9px;
           text-align:center;white-space:pre-wrap;}
  .otra{font-family:'JetBrains Mono',monospace;font-size:.64rem;line-height:1.8;
        opacity:.72;margin-top:13px;}
  .otra a{color:inherit;}
  /* El código es lo que la persona va a dictar o tipear: es el elemento más grande después del
     beneficio, y con separación entre caracteres para que no se confunda al leerlo. */
  .codigo{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:2.05rem;
          letter-spacing:.16em;padding:15px 10px;border:1px dashed var(--c-linea);
          border-radius:13px;margin:20px 0 8px;}
  .cond{font-family:'JetBrains Mono',monospace;font-size:.63rem;line-height:1.85;opacity:.72;
        margin-top:14px;}
  .cta{display:inline-block;margin-top:20px;background:var(--c-acento);color:var(--c-fondo);
       font-family:var(--f-tit);font-weight:700;text-decoration:none;padding:12px 26px;
       border-radius:11px;font-size:.98rem;}
  /* La letra chica es un párrafo, no una lista de advertencias sueltas: justificado y con
     punto seguido se lee de corrido y ocupa la mitad del alto. */
  .pie{font-size:.68rem;opacity:.6;margin-top:20px;line-height:1.6;text-align:justify;
       hyphens:auto;text-wrap:pretty;}
  .pie b{opacity:.9;}
  /* El pie de contacto se separa: son datos del negocio, no letra chica de la invitación. */
  .datos{border-top:1px solid var(--c-linea);margin-top:18px;padding-top:15px;
         font-family:'JetBrains Mono',monospace;font-size:.63rem;line-height:1.9;opacity:.75;}
  .datos a{color:inherit;text-decoration:none;}
  /* Los contactos en una línea. El ícono hace de etiqueta: sin él hay que escribir "Instagram:"
     y "WhatsApp:" delante de cada uno, que es más tinta para decir lo mismo. */
  .contactos{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
             gap:6px 16px;margin-top:4px;}
  .contactos span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
  .contactos svg{width:12px;height:12px;flex:0 0 auto;opacity:.85;}
  .sede{display:block;}
  .acciones{display:flex;gap:9px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
  .acc{background:none;border:1px solid var(--c-linea);color:var(--c-tinta);opacity:.7;
       border-radius:9px;padding:8px 15px;cursor:pointer;font-family:var(--f-txt);font-size:.82rem;}
  .acc:hover{opacity:1;}
  .mal{font-family:'JetBrains Mono',monospace;font-size:.78rem;line-height:1.7;opacity:.8;}
  /* Impreso: sin fondo oscuro (gasta tinta y se ve mal), sin botones, y en tamaño tarjeta. */
  /* Impreso: sin botones y a todo el ancho de la hoja. Los colores ya los puso el tema del
     beneficio — pisarlos acá dejaría en blanco una invitación que se pidió oscura a propósito. */
  @media print{
    body{padding:0;display:block;background:var(--c-suave);}
    .pase{width:100%;max-width:none;margin:0;box-shadow:none;}
    .cta,.acciones,.otra{display:none !important;}
    .caras{display:block !important;}
    .col{width:auto !important;}
    .marco{overflow:visible !important;height:auto !important;}
    .marco > .pase{position:static !important;transform:none !important;}
    /* El reemplazo del botón en papel: mismo lugar, misma jerarquía, sin nada que tocar. */
    .papel{display:block !important;}
    .envoltorio{width:100%;}
    .pie{opacity:.7;}
    /* Cada cara en su hoja: es como se manda a imprenta y como se arma la tarjeta. */
    .frente{border:0;border-radius:0;margin:0;page-break-after:always;}
    .cara-rot{display:none !important;}
  }
  /* Inerte, pero con su color real: bajarle la opacidad haría dudar del botón que se está
     yendo a evaluar, que es justo lo que la muestra tiene que mostrar bien. */
  :root[data-tema="claro"] .rotulo,
  :root[data-tema="claro"] .cond,
  :root[data-tema="claro"] .otra,
  :root[data-tema="claro"] .datos{opacity:.88;}
  :root[data-tema="claro"] .pie{opacity:.72;}
  :root[data-tema="claro"] .beneficio,
  :root[data-tema="claro"] .para{opacity:1;}
  /* En la muestra el botón no puede llevar a ningún lado —el código no existe— pero se veía
     idéntico al real: se clickeaba y no pasaba nada, que es peor que verlo apagado. */
  .cta.inerte{pointer-events:none;cursor:default;opacity:.45;box-shadow:none;}
  .cta.inerte::after{content:' (así se ve)';font-size:.72rem;font-weight:400;opacity:.8;}
  /* Sólo existe en papel: en pantalla el botón es mejor que un teléfono para copiar a mano. */
  .papel{display:none;margin-top:18px;font-family:var(--f-tit);font-size:1rem;line-height:1.45;}
  .papel b{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1.06rem;
           letter-spacing:.04em;color:var(--c-acento);}
  .aviso{max-width:430px;margin:16px auto 0;padding:11px 14px;border-radius:11px;
         border:1px dashed var(--c-linea);font-size:.78rem;line-height:1.5;opacity:.8;
         text-align:center;}
  @media print{ .aviso{display:none;} }
</style>
</head>
<body>
<div class="envoltorio">
<!-- Las dos caras, una al lado de la otra cuando hay ancho. En un teléfono no: dos A6 en paralelo
     entran a 160px cada una y no se lee ni el código. -->
<div class="caras">
<div class="col" id="cara-frente" style="display:none">
  <div class="cara-rot">Frente</div>
  <div class="frente"><img id="frente-img" alt=""></div>
</div>
<div class="col">
<div class="cara-rot" id="rot-dorso" style="display:none">Dorso</div>
<div id="marco">
<div class="pase" id="pase" style="display:none">
  <!-- El nombre del negocio no va como texto: ya está en el logo, y repetirlo lo ensucia. -->
  <span id="banda"><img class="logo" id="logo" alt="" style="display:none"></span>
  <div class="titulo" id="titulo">Invitación especial</div>
  <div class="detalle" id="detalle" style="display:none"></div>
  <div class="beneficio" id="beneficio"></div>
  <div class="para" id="para" style="display:none"></div>
  <div class="codigo" id="codigo"></div>
  <div class="rotulo">Presentá este código al reservar</div>
  <div class="cond" id="cond"></div>
  <a class="cta" id="cta" href="#">Reservar aquí</a>
  <div class="papel" id="papel"></div>
  <div class="otra" id="otra" style="display:none"></div>
  <div class="pie" id="pie"></div>
  <div class="datos" id="datos"></div>
</div>
</div>
</div>
</div>
<!-- Fuera de la tarjeta: son acciones de quien mira la pantalla, no parte de la invitación, y
     al imprimir no tienen que salir. -->
<div class="acciones" id="acciones" style="display:none">
  <button class="acc" onclick="window.print()">Imprimir</button>
  <button class="acc" id="b-compartir" onclick="compartir()">Compartir</button>
</div>
</div>
<div class="mal" id="error" style="display:none"></div>

<script>
const $ = id => document.getElementById(id);
// SVG inline y no una tipografía de íconos: la invitación se imprime y se guarda, y no puede
// depender de que un servidor externo conteste. Heredan el color del texto.
const ICONO = {
  web: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/></svg>',
  ig: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/></svg>',
  wa: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2c-5.46 0-9.9 4.44-9.9 9.9 0 1.75.46 3.45 1.32 4.95L2 22l5.3-1.39a9.86 9.86 0 0 0 4.74 1.21h.01c5.46 0 9.9-4.44 9.9-9.9 0-2.64-1.03-5.13-2.9-7A9.82 9.82 0 0 0 12.04 2zm5.8 14.1c-.25.7-1.45 1.33-2 1.4-.51.07-1.16.1-1.87-.12-.43-.14-.99-.32-1.7-.63-2.99-1.29-4.94-4.3-5.09-4.5-.15-.2-1.22-1.62-1.22-3.1 0-1.47.77-2.19 1.04-2.49.27-.3.6-.37.79-.37h.57c.18 0 .43-.7.67.51.25.6.85 2.07.92 2.22.07.15.12.32.02.52-.1.2-.15.32-.3.5l-.44.51c-.15.15-.3.32-.13.62.17.3.76 1.25 1.63 2.03 1.12 1 2.06 1.31 2.36 1.46.3.15.47.12.65-.07.17-.2.75-.87.95-1.17.2-.3.4-.25.67-.15.27.1 1.72.81 2.02.96.3.15.5.22.57.35.07.12.07.72-.18 1.42z"/></svg>',
};
const COD = decodeURIComponent(location.pathname.split('/').pop() || '');
// La misma página sirve el pase real y la muestra del panel. Tiene que ser la MISMA: una vista
// previa armada aparte mostraría bien algo que después se imprime mal.
const MUESTRA = /\/pase\/muestra\//.test(location.pathname);
const FUENTE = MUESTRA ? '/api/invitaciones/beneficios/' + encodeURIComponent(COD) + '/muestra'
                       : '/api/publico/pase/' + encodeURIComponent(COD);
const fecha = iso => String(iso || '').slice(0, 10).split('-').reverse().join('/');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

async function compartir() {
  const url = location.origin + '/i/' + COD;
  const texto = 'Invitación especial: ' + $('beneficio').textContent +
                '. Tu código: ' + $('codigo').textContent + '\n' + url;
  // navigator.share abre el menú del sistema (WhatsApp, mail, lo que haya). Donde no exista
  // —escritorio, casi siempre— se copia al portapapeles, que es el uso real de esta pantalla.
  try {
    if (navigator.share) { await navigator.share({ text: texto, url }); return; }
    await navigator.clipboard.writeText(texto);
    $('b-compartir').textContent = 'copiado ✓';
    setTimeout(() => { $('b-compartir').textContent = 'Compartir'; }, 2200);
  } catch (e) {}
}

/**
 * Deja el dorso del mismo tamaño que el frente. La escala se calcula acá y no en CSS porque
 * depende del texto real —una descripción larga necesita más reducción que una corta—.
 * Hay un piso: por debajo de eso la pieza se vuelve ilegible y es preferible que las dos caras
 * no midan exactamente lo mismo antes que no se pueda leer el código.
 */
const PISO_ESCALA = 0.5;
function igualarCaras() {
  const marco = $('marco'), pase = $('pase'), frente = document.querySelector('.frente');
  if (!marco || !pase) return;
  marco.classList.remove('marco'); pase.style.transform = ''; pase.style.width = '';
  marco.style.height = '';
  if (!frente || !$('cara-frente') || $('cara-frente').style.display === 'none') return;
  const alto = frente.getBoundingClientRect().height;
  const ancho = marco.getBoundingClientRect().width;
  if (!alto || !ancho) return;
  marco.classList.add('marco');

  // El truco: la tarjeta se dibuja MÁS ANCHA y después se reduce. Escalar a secas la achicaría
  // también de ancho —quedaría una tarjetita al costado, no la misma pieza—. Dibujada al doble
  // de ancho y reducida a la mitad, el ancho visible es el mismo y el alto entra.
  // Se itera porque al ensancharla el texto ocupa menos renglones y hace falta menos reducción.
  let k = 1;
  for (let i = 0; i < 4; i++) {
    pase.style.width = (ancho / k) + 'px';
    const nuevo = Math.max(PISO_ESCALA, Math.min(1, alto / pase.scrollHeight * k));
    if (Math.abs(nuevo - k) < 0.005) { k = nuevo; break; }
    k = nuevo;
  }
  pase.style.width = (ancho / k) + 'px';
  pase.style.transform = 'scale(' + k + ')';
  marco.style.height = Math.round(pase.scrollHeight * k) + 'px';
}

function marca(m, claro) {
  if (!m || !Object.keys(m).length) return;
  const r = document.documentElement.style;
  // Los nombres son los que guarda la identidad del negocio (texto, superficie), no los de los
  // tokens de esta página: usar el nombre del token deja el pase con la paleta de ClaUsina y
  // sin ningún error a la vista.
  const set = (v, k) => { if (m[k]) r.setProperty(v, m[k]); };
  // El fondo de la marca se guarda igual aunque no se use de fondo: es lo que va detrás del
  // logo cuando el pase es claro y el negocio no tiene una versión clara del suyo.
  if (m.fondo) r.setProperty('--c-marca-fondo', m.fondo);
  set('--c-acento', 'acento');
  // En claro la marca aporta el acento y las tipografías, nada más: si aportara el fondo y la
  // tinta, elegir "claro" no cambiaría nada en una marca oscura.
  if (!claro) { set('--c-fondo', 'fondo'); set('--c-tinta', 'texto');
                set('--c-suave', 'superficie'); set('--c-linea', 'linea'); }
  const fams = [m.fuente_titulo, m.fuente_texto].filter(Boolean);
  if (fams.length) {
    const q = fams.map(f => 'family=' + encodeURIComponent(f).replace(/%20/g, '+') + ':wght@400;600;700').join('&');
    document.getElementById('fuentes').href =
      `https://fonts.googleapis.com/css2?${q}&family=JetBrains+Mono:wght@500;700&display=swap`;
    if (m.fuente_titulo) r.setProperty('--f-tit', `'${m.fuente_titulo}', sans-serif`);
    if (m.fuente_texto) r.setProperty('--f-txt', `'${m.fuente_texto}', sans-serif`);
  }
}

(async () => {
  try {
    const j = await fetch(FUENTE).then(r => r.json());
    if (!j.ok) {
      // Un pase que no sirve igual dice de qué negocio es y deja reservar: perder la reserva por
      // un código vencido es peor que perder el descuento.
      $('error').style.display = '';
      $('error').innerHTML = (j.mensaje || 'Esta invitación no está disponible.') +
        (j.negocio_slug ? `<br><br><a class="cta" href="/r/${j.negocio_slug}">Reservar igual</a>` : '');
      return;
    }
    // El beneficio manda sobre el modo: es una decisión de esta pieza, no del sitio.
    const claro = (j.tema || 'claro') === 'claro';
    if (claro) document.documentElement.dataset.tema = 'claro';
    marca(j.marca, claro);
    document.title = 'Invitación especial · ' + j.negocio;
    // Al imprimir, la hoja es del tamaño de la invitación. Sin esto el navegador usa A4 y la
    // tarjeta sale flotando en el medio de una hoja que después hay que recortar a ojo.
    const mm = j.frente_mm && j.frente_mm[0] ? j.frente_mm : [105, 148];
    document.head.insertAdjacentHTML('beforeend',
      `<style>@page{size:${mm[0]}mm ${mm[1]}mm;margin:0}` +
      // La tipografía se achica en bloque: la tarjeta en pantalla es cómoda a 430px, y a 105mm
      // el mismo cuerpo hace que el dorso se parta en dos hojas.
      `@media print{html{font-size:11px}.envoltorio,.pase{width:${mm[0]}mm}` +
      `.frente{width:${mm[0]}mm;height:${mm[1]}mm;margin:0}` +
      `.frente img{width:100%;height:100%;object-fit:cover}` +
      `.pase{height:${mm[1]}mm;border-radius:0;border:0;padding:6mm 6mm 9mm;overflow:hidden}` +
      `.pase::after{inset:2mm;border-radius:0}` +
      `.logo{max-height:16mm;margin-bottom:4mm}.codigo{margin:4mm 0 2mm;padding:3mm 2mm}` +
      `.pie{margin-top:4mm}.datos{margin-top:4mm;padding-top:3mm}}</style>`);
    const src = claro && j.logo_claro ? j.logo_claro : j.logo;
    if (src) {
      $('logo').src = src; $('logo').alt = j.negocio; $('logo').style.display = '';
      // La banda sólo cuando hace falta: con una versión clara del logo sería un recuadro de más.
      if (claro && !j.logo_claro) $('banda').className = 'banda';
    }
    // Sin logo cargado el nombre tiene que aparecer igual, si no la tarjeta no dice de quién es.
    else { $('titulo').textContent = j.negocio + ' te invita'; }
    // El frente que definió el beneficio. Si no tiene, la invitación es de una sola cara y no
    // se anuncian caras que no existen.
    if (j.frente) {
      $('frente-img').src = j.frente;
      $('frente-img').alt = 'Frente de la invitación' + (j.frente_codigo ? ' (' + j.frente_codigo + ')' : '');
      $('cara-frente').style.display = '';
      // El rótulo 'Dorso' sólo tiene sentido si hay un frente del que distinguirlo.
      $('rot-dorso').style.display = '';
    }
    // El nombre del beneficio titula la invitación: "Primeros Clientes" dice para quién es, y
    // "Invitación especial" a secas no distingue una campaña de otra.
    if (j.nombre) $('titulo').textContent = 'Invitación especial · ' + j.nombre;
    if (j.descripcion) { $('detalle').textContent = j.descripcion; $('detalle').style.display = ''; }
    $('beneficio').textContent = j.texto;
    if (j.etiqueta) { $('para').textContent = 'Para ' + j.etiqueta; $('para').style.display = ''; }
    $('codigo').textContent = j.codigo.replace(/^(.{3})(.{3})$/, '$1-$2');
    if (MUESTRA) {
      // Sin esto la muestra se puede imprimir y repartir por error: tiene que ser evidente en la
      // propia tarjeta que ese código no existe.
      document.title = 'Muestra · ' + j.negocio;
      $('cta').removeAttribute('href');
      $('cta').classList.add('inerte');
      $('acciones').insertAdjacentHTML('beforebegin',
        '<div class="aviso">Así se va a ver la invitación. El código es de muestra y por eso el ' +
        'botón está apagado: en una invitación real abre WhatsApp con el código ya escrito.</div>');
    }

    const c = j.condiciones || {};
    const l = [...(c.frases || [])];
    if (j.vence_en) l.push('Vence el ' + fecha(j.vence_en));
    // Cuántos usos quedan es un dato de gestión: impreso invita a contar y a llegar último.
    if (j.usos_max > 1) l.push('Cupos limitados');
    $('cond').innerHTML = l.join('<br>');
    // El otro camino: mucha gente prefiere escribir antes que llenar un formulario.
    if (j.whatsapp) {
      const wa = j.whatsapp.replace(/[^0-9]/g, '');
      // Todas las reservas entran por WhatsApp: obliga a que el cliente inicie la conversación,
      // que es lo que después permite confirmarle sola la reserva. El código va en el mensaje
      // para que no tenga que copiarlo a mano.
      if (!MUESTRA) {
        $('cta').href = 'https://wa.me/' + wa + '?text=' +
          encodeURIComponent('Hola, tengo la invitación ' + j.codigo + ' y quiero reservar.');
      }
      $('cta').textContent = 'Reservar por WhatsApp';
      $('otra').innerHTML = 'o escribinos a <a href="https://wa.me/' + wa + '">' + j.whatsapp + '</a>';
      $('otra').style.display = '';
      // En papel el botón no se puede tocar: ahí la reserva se pide por WhatsApp, y decirlo como
      // camino principal —no como alternativa— es lo que hace que el cliente escriba primero.
      $('papel').innerHTML = 'Reservá por WhatsApp<br><b>' + j.whatsapp.replace(/</g, '') +
        '</b><br>y decinos tu código';
    } else {
      // Sin WhatsApp configurado queda el camino viejo: un botón muerto es peor que uno menos bueno.
      if (!MUESTRA) $('cta').href = '/i/' + j.codigo;
      $('papel').innerHTML = 'Reservá antes de venir' + (j.web ? '<br><b>' + j.web + '</b>' : '');
    }
    // El disclaimer que pidió Fer: la invitación se valida al llegar, no al reservar. Es la
    // diferencia entre tomarla y consumirla, dicha en el único lugar donde la lee el invitado.
    // La reserva es obligatoria y se dice primero: el riesgo real no es el descuento mal
    // aplicado, es alguien que llega con la tarjeta y se encuentra sin mesa.
    $('pie').innerHTML = '<b>Válida sólo con reserva previa</b>, sin reserva no podemos ' +
      'garantizarte lugar. Presentá esta invitación al llegar al local para validarla. ' +
      'Descuento válido para pago en efectivo o transferencia.';
    const sede = j.sede
      ? [j.sede.direccion, j.sede.localidad, j.sede.partido].filter(Boolean).join(', ') : '';
    const ig = j.instagram ? String(j.instagram).replace('@', '') : '';
    const wa = j.whatsapp ? String(j.whatsapp).replace(/[^0-9]/g, '') : '';
    const linea = [];
    if (j.web) linea.push(`<span>${ICONO.web}<a href="https://${esc(j.web)}">${esc(j.web)}</a></span>`);
    if (ig) linea.push(`<span>${ICONO.ig}<a href="https://instagram.com/${esc(ig)}">@${esc(ig)}</a></span>`);
    if (j.whatsapp) linea.push(`<span>${ICONO.wa}<a href="https://wa.me/${esc(wa)}">${esc(j.whatsapp)}</a></span>`);
    $('datos').innerHTML = (sede ? `<span class="sede">${esc(sede)}</span>` : '') +
      (linea.length ? `<div class="contactos">${linea.join('')}</div>` : '');
    // Imprimir o compartir una muestra sería repartir un código que no existe.
    if (!MUESTRA) $('acciones').style.display = '';
    $('pase').style.display = '';
    igualarCaras();
    addEventListener('resize', igualarCaras);
  } catch (e) {
    $('error').style.display = '';
    $('error').textContent = 'No pude cargar esta invitación.';
  }
})();
</script>
</body>
</html>
