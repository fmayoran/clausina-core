<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invitación</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;700;800&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Los tokens los pisa la marca del negocio, igual que en la página de reservas: el pase es del
     negocio, no de ClaUsina. Sin marca cargada, cae en una paleta neutra. */
  :root{--f-tit:'Inter Tight',sans-serif;--f-txt:'Inter',sans-serif;
        --c-fondo:#101014;--c-tinta:#F5F2EC;--c-acento:#CCF24D;--c-suave:#1b1b21;--c-linea:#2a2a33;}
  *{box-sizing:border-box;margin:0;}
  body{background:var(--c-fondo);color:var(--c-tinta);font-family:var(--f-txt);
       min-height:100vh;display:grid;place-items:center;padding:26px 18px;}
  .pase{width:min(430px,100%);background:var(--c-suave);border:1px solid var(--c-linea);
        border-radius:20px;padding:30px 28px 26px;text-align:center;position:relative;overflow:hidden;}
  .cab{display:flex;align-items:center;gap:11px;justify-content:center;margin-bottom:22px;}
  .logo{height:38px;width:auto;border-radius:7px;}
  .negocio{font-family:var(--f-tit);font-weight:800;font-size:1.02rem;letter-spacing:-.01em;}
  .rotulo{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.24em;
          text-transform:uppercase;opacity:.62;}
  .beneficio{font-family:var(--f-tit);font-weight:800;font-size:1.72rem;line-height:1.15;
             margin:16px 0 6px;color:var(--c-acento);}
  .para{font-size:.94rem;opacity:.8;margin-bottom:22px;}
  /* El código es lo que la persona va a dictar o tipear: es el elemento más grande después del
     beneficio, y con separación entre caracteres para que no se confunda al leerlo. */
  .codigo{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:2.05rem;
          letter-spacing:.16em;padding:15px 10px;border:1px dashed var(--c-linea);
          border-radius:13px;margin-bottom:8px;}
  .cond{font-family:'JetBrains Mono',monospace;font-size:.63rem;line-height:1.85;opacity:.72;
        margin-top:14px;}
  .cta{display:inline-block;margin-top:20px;background:var(--c-acento);color:var(--c-fondo);
       font-family:var(--f-tit);font-weight:700;text-decoration:none;padding:12px 26px;
       border-radius:11px;font-size:.98rem;}
  .pie{font-family:'JetBrains Mono',monospace;font-size:.56rem;opacity:.45;margin-top:20px;line-height:1.7;}
  .acciones{display:flex;gap:9px;justify-content:center;margin-top:18px;flex-wrap:wrap;}
  .acc{background:none;border:1px solid var(--c-linea);color:var(--c-tinta);opacity:.7;
       border-radius:9px;padding:8px 15px;cursor:pointer;font-family:var(--f-txt);font-size:.82rem;}
  .acc:hover{opacity:1;}
  .mal{font-family:'JetBrains Mono',monospace;font-size:.78rem;line-height:1.7;opacity:.8;}
  /* Impreso: sin fondo oscuro (gasta tinta y se ve mal), sin botones, y en tamaño tarjeta. */
  @media print{
    body{background:#fff;color:#111;padding:0;display:block;}
    .pase{border:1px solid #bbb;border-radius:14px;background:#fff;width:100%;max-width:none;
          margin:0;box-shadow:none;}
    .beneficio{color:#111;}
    .cta,.acciones{display:none !important;}
    .codigo{border-color:#999;}
    .pie{opacity:.7;}
  }
</style>
</head>
<body>
<div class="pase" id="pase" style="display:none">
  <div class="cab">
    <img class="logo" id="logo" alt="" style="display:none">
    <div class="negocio" id="negocio"></div>
  </div>
  <div class="rotulo">Invitación</div>
  <div class="beneficio" id="beneficio"></div>
  <div class="para" id="para" style="display:none"></div>
  <div class="codigo" id="codigo"></div>
  <div class="rotulo">Presentá este código al reservar</div>
  <div class="cond" id="cond"></div>
  <a class="cta" id="cta" href="#">Reservar ahora</a>
  <div class="acciones">
    <button class="acc" onclick="window.print()">Imprimir</button>
    <button class="acc" id="b-compartir" onclick="compartir()">Compartir</button>
  </div>
  <div class="pie" id="pie"></div>
</div>
<div class="mal" id="error" style="display:none"></div>

<script>
const $ = id => document.getElementById(id);
const COD = decodeURIComponent(location.pathname.split('/').pop() || '');
const DIAS = { 1:'lunes', 2:'martes', 3:'miércoles', 4:'jueves', 5:'viernes', 6:'sábados', 7:'domingos' };
const fecha = iso => String(iso || '').slice(0, 10).split('-').reverse().join('/');

async function compartir() {
  const url = location.origin + '/i/' + COD;
  const texto = $('beneficio').textContent + ' en ' + $('negocio').textContent +
                '. Tu código: ' + $('codigo').textContent + '\n' + url;
  // navigator.share abre el menú del sistema (WhatsApp, mail, lo que haya). Donde no exista
  // —escritorio, casi siempre— se copia al portapapeles, que es el uso real de esta pantalla.
  try {
    if (navigator.share) { await navigator.share({ text: texto, url }); return; }
    await navigator.clipboard.writeText(texto);
    $('b-compartir').textContent = 'copiado ✓';
    setTimeout(() => { $('b-compartir').textContent = 'Compartir'; }, 2200);
  } catch (e) {}
}

function marca(m) {
  if (!m || !Object.keys(m).length) return;
  const r = document.documentElement.style;
  if (m.fondo) r.setProperty('--c-fondo', m.fondo);
  if (m.tinta) r.setProperty('--c-tinta', m.tinta);
  if (m.acento) r.setProperty('--c-acento', m.acento);
  if (m.suave) r.setProperty('--c-suave', m.suave);
  if (m.linea) r.setProperty('--c-linea', m.linea);
  if (m.fuente_titulo) r.setProperty('--f-tit', `'${m.fuente_titulo}', sans-serif`);
  if (m.fuente_texto) r.setProperty('--f-txt', `'${m.fuente_texto}', sans-serif`);
}

(async () => {
  try {
    const j = await fetch('/api/publico/pase/' + encodeURIComponent(COD)).then(r => r.json());
    if (!j.ok) {
      // Un pase que no sirve igual dice de qué negocio es y deja reservar: perder la reserva por
      // un código vencido es peor que perder el descuento.
      $('error').style.display = '';
      $('error').innerHTML = (j.mensaje || 'Esta invitación no está disponible.') +
        (j.negocio_slug ? `<br><br><a class="cta" href="/r/${j.negocio_slug}">Reservar igual</a>` : '');
      return;
    }
    marca(j.marca);
    document.title = 'Invitación · ' + j.negocio;
    $('negocio').textContent = j.negocio;
    if (j.logo) { $('logo').src = j.logo; $('logo').style.display = ''; }
    $('beneficio').textContent = j.texto;
    if (j.etiqueta) { $('para').textContent = 'Para ' + j.etiqueta; $('para').style.display = ''; }
    $('codigo').textContent = j.codigo.replace(/^(.{3})(.{3})$/, '$1-$2');
    $('cta').href = '/i/' + j.codigo;

    const c = j.condiciones || {};
    const l = [];
    if ((c.dias || []).length) l.push('Válida ' + c.dias.map(d => DIAS[d]).join(', '));
    if (c.cantidad_max) l.push('Hasta ' + c.cantidad_max + ' personas');
    if (j.vence_en) l.push('Vence el ' + fecha(j.vence_en));
    if (j.usos_max > 1) l.push('Cupo: ' + j.usos_max + ' usos');
    $('cond').innerHTML = l.join('<br>');
    $('pie').textContent = 'Sujeta a disponibilidad · El descuento se aplica al pagar';
    $('pase').style.display = '';
  } catch (e) {
    $('error').style.display = '';
    $('error').textContent = 'No pude cargar esta invitación.';
  }
})();
</script>
</body>
</html>
