<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClaUsina — Acceso</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Inter:wght@400;450;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="fonts/clausina-icono-180.png">
<style>
  :root{--bg:#0A0B0D;--panel:#111317;--line:#20242B;--chalk:#ECEEF0;--white:#F5F2EC;--ash:#8A8F98;--fire:#CCF24D;--ember:#CCF24D;--alarm:#FF6A45;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--chalk);font-family:'Inter Tight',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:38px 34px;width:100%;max-width:380px;}
  .iso{width:64px;height:64px;border-radius:14px;display:block;margin-bottom:18px;}
  .logo{font-weight:900;font-size:2rem;letter-spacing:.04em;color:var(--white);}
  .logo b.dot{color:#CCF24D;}
  .sub{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ash);margin-top:4px;margin-bottom:28px;}
  label{display:block;font-family:'JetBrains Mono',monospace;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ash);margin-bottom:8px;}
  input{width:100%;background:#0c0c0a;border:1px solid var(--line);border-radius:6px;color:var(--white);font-family:'Inter Tight',sans-serif;font-size:1.1rem;padding:11px 13px;outline:none;}
  input:focus{border-color:var(--ember);}
  button{width:100%;margin-top:18px;background:var(--fire);color:#0c0c0a;border:none;border-radius:6px;font-family:'Inter Tight',sans-serif;font-weight:700;font-size:1.05rem;letter-spacing:.05em;text-transform:uppercase;padding:11px;cursor:pointer;transition:.15s;}
  button:hover{background:var(--ember);}
  button:disabled{opacity:.55;cursor:default;}
  .err{margin-top:14px;min-height:1.1em;font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--alarm);letter-spacing:.04em;}
</style>
</head>
<body>
  <form class="card" onsubmit="entrar(event)">
    <img class="iso" src="favicon.svg" alt="ClaUsina">
    <div class="logo">Cla<b>U</b>sina<b class="dot">.</b></div>
    <div class="sub">Agencia · impulsada por Claude</div>
    <div id="gbox" style="display:none">
      <a id="gbtn" href="auth/google" style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;color:#1f1f1f;border:1px solid #dadce0;border-radius:6px;font-family:'Inter Tight',sans-serif;font-weight:600;font-size:1rem;padding:11px;text-decoration:none;transition:.15s;">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24s.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Entrar con Google
      </a>
      <div style="display:flex;align-items:center;gap:12px;margin:20px 0 4px;">
        <div style="flex:1;height:1px;background:var(--line)"></div>
        <span class="sub" style="margin:0;font-size:.6rem;">o con contraseña</span>
        <div style="flex:1;height:1px;background:var(--line)"></div>
      </div>
    </div>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" autofocus>
    <label for="pw" style="margin-top:16px">Contraseña</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button id="btn" type="submit">Entrar</button>
    <div class="err" id="err"></div>
  </form>
<script>
// El botón de Google sólo aparece si está configurado del lado del servidor.
fetch('api/auth/config').then(r=>r.ok?r.json():null).then(d=>{
  if(d && d.google) document.getElementById('gbox').style.display='';
}).catch(()=>{});

// Mensajes de vuelta del circuito de Google.
(function(){
  const q = new URLSearchParams(location.search);
  const e = q.get('e'); if(!e) return;
  const mail = q.get('m') ? ` (${q.get('m')})` : '';
  const msg = {
    sinacceso: `Esa cuenta${mail} todavía no tiene acceso. Pedíselo a tu administrador.`,
    google:    'No se pudo completar el ingreso con Google. Probá de nuevo.',
    estado:    'La sesión de ingreso venció. Probá de nuevo.',
    cancelado: 'Cancelaste el ingreso con Google.',
    nogoogle:  'El ingreso con Google no está configurado.',
  }[e];
  if(msg) document.getElementById('err').textContent = msg;
  history.replaceState(null,'',location.pathname);
})();

async function entrar(e){
  e.preventDefault();
  const btn=document.getElementById('btn'), err=document.getElementById('err');
  err.textContent=''; btn.disabled=true; btn.textContent='Entrando…';
  try{
    const r=await fetch('api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('pw').value})});
    if(r.ok){ location.href='.'; return; }
    err.textContent='Email o contraseña incorrectos.';
  }catch(_){ err.textContent='Error de conexión.'; }
  btn.disabled=false; btn.textContent='Entrar';
  document.getElementById('pw').select();
}
</script>
</body>
</html>
