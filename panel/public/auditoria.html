<style>
  .gen{margin-left:14px;background:var(--pend,#FF6A45);color:#0c0c0a;border:0;border-radius:8px;
       font-family:'Inter Tight',sans-serif;font-weight:700;padding:7px 15px;cursor:pointer;}
  .gen:disabled{opacity:.5;cursor:default;}
  .corriendo{display:flex;align-items:center;gap:11px;border:1px dashed var(--line);
             border-radius:12px;padding:15px 18px;margin-bottom:18px;}
  .corriendo .sp{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);
                 border-top-color:var(--pend,#FF6A45);animation:gira .9s linear infinite;flex:0 0 auto;}
  @keyframes gira{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){.corriendo .sp{animation:none}}
  .malaud{color:#FF6B4A;}
  .cabecera{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px;}
  .cabecera h1{font-family:'Barlow Condensed','Inter Tight',sans-serif;font-size:1.5rem;
               font-weight:700;color:var(--white);margin:0;}
  .cabecera .gen{margin-left:auto;}
  .intro{font-family:'IBM Plex Mono','JetBrains Mono',monospace;font-size:.72rem;color:var(--ash);
         line-height:1.7;max-width:76ch;margin:0 0 18px;}
</style>
<style>
  .wrap{padding:18px 28px 70px;max-width:1180px;margin:0 auto;}
  .sect{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:26px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line);}
  .sect:first-child{margin-top:6px;}
  .sect .t{font-family:'Barlow Condensed',sans-serif;font-size:1.5rem;font-weight:700;color:var(--white);}
  .sect .m{font-family:'IBM Plex Mono',monospace;font-size:.62rem;color:var(--ash);letter-spacing:.04em;}
  /* Cada métrica contra su banda de referencia. El semáforo NO es el valor absoluto sino el
     veredicto que ya calculó el motor: para CPM estar abajo es bueno y para CTR es malo, y esa
     lectura no puede quedar en el frontend repetida y desincronizada. */
  .bm{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:16px;}
  .bmc{border:1px solid var(--u-line);border-radius:10px;padding:11px 12px;position:relative;}
  .bmc .bt{font-family:'JetBrains Mono',monospace;font-size:.55rem;letter-spacing:.08em;
    text-transform:uppercase;color:var(--u-mut);display:flex;align-items:center;gap:6px;}
  .bmc .bv{font-size:1.5rem;font-weight:600;line-height:1.15;margin:3px 0 1px;}
  .bmc .bx{font-size:.72rem;color:var(--u-mut);}
  .bmc .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
  .v-bien .dot{background:var(--u-bien,#5ec27a);} .v-bien .bv{color:var(--u-bien,#5ec27a);}
  .v-atencion .dot{background:#E0A526;} .v-atencion .bv{color:#E0A526;}
  .v-mal .dot{background:var(--u-mal);} .v-mal .bv{color:var(--u-mal);}
  .v-sin_dato{opacity:.6;} .v-sin_dato .dot{background:var(--u-mut);}
  /* La banda: dónde cae el valor dentro del rango típico. Un número sin su escala no dice nada. */
  .banda{height:4px;border-radius:2px;background:rgba(127,127,127,.18);margin-top:8px;position:relative;}
  .banda i{position:absolute;top:0;bottom:0;background:rgba(127,127,127,.34);border-radius:2px;}
  .banda b{position:absolute;top:-3px;width:2px;height:10px;background:currentColor;border-radius:1px;}
  .fuente{font-size:.66rem;color:var(--u-mut);margin:-8px 0 16px;line-height:1.45;}
  .tab{width:100%;border-collapse:collapse;font-size:.85rem;}
  .tab th{text-align:left;font-family:'JetBrains Mono',monospace;font-size:.55rem;letter-spacing:.08em;
    text-transform:uppercase;color:var(--u-mut);font-weight:400;padding:0 8px 6px 0;}
  .tab td{padding:7px 8px 7px 0;border-top:1px solid var(--u-line);}
  .tab .n{text-align:right;font-family:'JetBrains Mono',monospace;font-size:.78rem;white-space:nowrap;}
  .tab .cf{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--u-mut);margin-right:6px;}
  .ganador{border:1px solid color-mix(in srgb,var(--u-bien,#5ec27a) 45%,transparent);
    background:color-mix(in srgb,var(--u-bien,#5ec27a) 10%,transparent);
    border-radius:9px;padding:10px 12px;margin-bottom:16px;font-size:.87rem;}
  .ganador.sin{border-color:var(--u-line);background:none;color:var(--u-mut);}
  /* Tablero: una tarjeta por sección auditada. El informe entero en una sola página no se leía;
     acá se entra por el titular y el detalle queda a un clic. */
  .dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;}
  .dcard{background:#0c0c0a;border:1px solid var(--line);border-radius:12px;padding:17px 18px;
    text-align:left;width:100%;cursor:pointer;font:inherit;color:inherit;display:flex;
    flex-direction:column;gap:10px;transition:border-color .15s;}
  .dcard:hover{border-color:color-mix(in srgb,#1ec9ff 45%,var(--line));}
  .dcard[disabled]{cursor:default;opacity:.55;}
  .dcard[disabled]:hover{border-color:var(--line);}
  .dc-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .dc-tt{font-family:'Barlow Condensed',sans-serif;font-size:1.3rem;font-weight:700;color:var(--white);}
  .dc-sub{font-family:'IBM Plex Mono',monospace;font-size:.58rem;color:var(--ash);}
  .dc-big{font-family:'Barlow Condensed',sans-serif;font-size:2.5rem;line-height:.95;color:var(--white);}
  .dc-big small{font-size:.95rem;color:var(--ash);font-family:'IBM Plex Mono',monospace;margin-left:5px;}
  .dc-lab{font-family:'IBM Plex Mono',monospace;font-size:.56rem;text-transform:uppercase;
    letter-spacing:.05em;color:var(--ash);margin-top:-6px;}
  .dc-cw{position:relative;height:96px;}
  /* Semáforo agregado: cuántas métricas de la sección están bien, en atención o mal. */
  .sem{display:flex;gap:5px;align-items:center;min-height:13px;font-family:'IBM Plex Mono',monospace;font-size:.62rem;color:var(--ash);}
  .sem i{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .sem .b{background:#5ec27a;} .sem .a{background:#E0A526;} .sem .m{background:var(--fire,#FF6B4A);}
  .dc-ir{font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:#1ec9ff;margin-top:2px;}
  /* Navegación del detalle */
  .volver{background:none;border:1px solid var(--line);border-radius:8px;color:var(--ash);
    font:inherit;font-size:.78rem;padding:6px 12px;cursor:pointer;margin-bottom:16px;}
  .volver:hover{color:var(--white);border-color:var(--ash);}
  /* Las conclusiones no se muestran de entrada: son el cierre, no la portada. */
  .verreco{display:block;width:100%;margin-top:18px;background:none;border:1px dashed var(--line);
    border-radius:10px;color:#1ec9ff;font:inherit;font-size:.9rem;padding:13px;cursor:pointer;}
  .verreco:hover{border-color:#1ec9ff;background:color-mix(in srgb,#1ec9ff 7%,transparent);}
  .oculto{display:none;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px;}
  .kpi{background:#0c0c0a;border:1px solid var(--line);border-radius:9px;padding:14px 16px;}
  .kpi b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:1.9rem;color:var(--white);line-height:1;}
  .kpi.cy b{color:#1ec9ff;} .kpi.gr b{color:#5ec27a;}
  .kpi span{font-family:'IBM Plex Mono',monospace;font-size:.56rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ash);display:block;margin-top:5px;}
  .kpi .bm{font-family:'IBM Plex Mono',monospace;font-size:.54rem;color:#6b7280;margin-top:3px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:820px){.grid{grid-template-columns:1fr;}}
  .card{background:#0c0c0a;border:1px solid var(--line);border-radius:9px;padding:14px 16px;}
  .card h3{font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ash);margin-bottom:12px;}
  .card .cw{position:relative;height:230px;}
  .chk{display:flex;flex-direction:column;gap:7px;}
  .chk-row{display:flex;align-items:center;gap:9px;font-size:.86rem;color:var(--chalk);}
  .chk-row .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
  .d.ok{background:#5ec27a;} .d.no{background:var(--fire);}
  .chk-row .dt{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:var(--ash);}
  .chk-row .ct{font-family:'IBM Plex Mono',monospace;font-size:.54rem;color:#6b7280;text-transform:uppercase;width:48px;flex:0 0 auto;}
  .reco{background:#0c0c0a;border:1px solid var(--line);border-top:3px solid #1ec9ff;border-radius:9px;padding:16px 20px;margin-top:14px;}
  .reco h2{font-family:'Barlow Condensed',sans-serif;font-size:1.15rem;color:#1ec9ff;margin:12px 0 5px;}
  .reco h2:first-child{margin-top:0;}
  .reco p,.reco li{font-size:.95rem;color:var(--chalk);line-height:1.5;}
  .reco ul,.reco ol{margin:5px 0 5px 20px;} .reco strong{color:var(--white);}
  .nodata{color:var(--ash);font-size:.9rem;padding:14px 2px;font-family:'IBM Plex Mono',monospace;}
  .empty{color:var(--ash);font-size:.95rem;padding:40px 4px;}
</style>
</head>
<body>
<div class="shell"><main class="min-w-0">
  <div id="toast"></div>
  <!-- El encabezado propio se fue: era de la época anterior al shell, decía CORTAFUEGO fijo para
       cualquier negocio y estaba oculto, así que el botón de generar nunca se veía. -->
  <div class="cabecera">
    <h1>Auditoría</h1>
    <span class="upd" id="upd"></span>
    <button class="gen" id="b-gen" onclick="generar()">Generar auditoría</button>
  </div>
  <p class="intro">Mide la web contra el sitio publicado y el Instagram contra lo que ya se
    publicó y la pauta contra lo que se invirtió en Meta. Cada sección se compara con su
    benchmark y cierra con recomendaciones priorizadas.</p>
  <div id="estado-aud"></div>
  <div class="wrap" id="wrap"><div class="empty">Cargando auditoría…</div></div>
</main></div>

<script>
// Todo encerrado: este script comparte el ámbito global con panel.js, y un nombre repetido
// —pasó con 'pct'— es un SyntaxError que mata la página entera antes de la primera línea. La
// pantalla quedaba clavada en "Cargando auditoría…" sin llamar a la API ni dejar rastro.
(() => {
const nfmt=n=>(n==null?'—':new Intl.NumberFormat('es-AR').format(n));
const pct=v=>(v==null?'—':v+'%');
function md(t){ if(!t) return '';
  const L=t.split('\n'); let h=''; let il=null; const cl=()=>{if(il){h+='</'+il+'>';il=null;}};
  for(let l of L){ l=l.trim(); if(!l){cl();continue;} l=l.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    if(l.startsWith('## ')){cl();h+='<h2>'+l.slice(3)+'</h2>';}
    else if(/^\d+\.\s/.test(l)){if(il!=='ol'){cl();h+='<ol>';il='ol';}h+='<li>'+l.replace(/^\d+\.\s/,'')+'</li>';}
    else if(l.startsWith('- ')){if(il!=='ul'){cl();h+='<ul>';il='ul';}h+='<li>'+l.slice(2)+'</li>';}
    else{cl();h+='<p>'+l+'</p>';} } cl(); return h; }
function kpi(val,label,bm,cls){ return `<div class="kpi ${cls||''}"><b>${val}</b><span>${label}</span>${bm?`<div class="bm">${bm}</div>`:''}</div>`; }

// Los gráficos se guardan para destruirlos al cambiar de vista: Chart.js no deja reusar un
// canvas con un gráfico vivo encima, y al volver al tablero la segunda vez tiraba error y dejaba
// la pantalla en blanco.
let WEB=null, IG=null, PAUTA=null;
let CHARTS=[];
const mk=(id,cfg)=>{ const el=document.getElementById(id); if(!el) return null;
  const c=new Chart(el,cfg); CHARTS.push(c); return c; };
function limpiarCharts(){ CHARTS.forEach(c=>{try{c.destroy();}catch(e){}}); CHARTS=[]; }

// Pinta la banda del benchmark detrás de las barras. Un gráfico sin la referencia encima obliga
// a mirar el número, buscar el rango en otro lado y comparar de memoria; con la banda, estar
// dentro o fuera se ve de una. Es la diferencia entre un gráfico y un tablero de control.
const bandaBM={id:'bandaBM',beforeDatasetsDraw(ch,args,opts){
  if(!opts||opts.lo==null||opts.hi==null) return;
  const {ctx,chartArea:a}=ch; const y=ch.scales[opts.yScaleID||'y']; if(!y) return;
  const y1=y.getPixelForValue(opts.hi), y2=y.getPixelForValue(opts.lo);
  ctx.save();
  ctx.fillStyle=opts.color||'rgba(94,194,122,.13)';
  ctx.fillRect(a.left,Math.max(a.top,y1),a.right-a.left,Math.min(a.bottom,y2)-Math.max(a.top,y1));
  ctx.strokeStyle=opts.borde||'rgba(94,194,122,.42)'; ctx.setLineDash([4,3]); ctx.lineWidth=1;
  [y1,y2].forEach(yy=>{ if(yy>a.top&&yy<a.bottom){ ctx.beginPath();ctx.moveTo(a.left,yy);ctx.lineTo(a.right,yy);ctx.stroke(); }});
  ctx.restore();
}};
Chart.register(bandaBM);
// Saca el rango de una métrica ya evaluada por el motor, para pasárselo al gráfico.
function rangoDe(ms,clave){ const m=(ms||[]).find(x=>x.clave===clave); return m&&m.rango?{lo:m.rango[0],hi:m.rango[1]}:{}; }

Chart.defaults.color='#8a8a82'; Chart.defaults.font.family="'IBM Plex Mono', monospace"; Chart.defaults.font.size=10;
const GRID={color:'rgba(255,255,255,0.06)'};
const CY='#1ec9ff', OR='#ff7700', GR='#5ec27a', GD='#E0A526';

// Dibuja una métrica con su banda de referencia. `m` viene del motor con el veredicto ya resuelto.
function bmCard(m){
  if(!m) return '';
  const [lo,hi]=m.rango||[null,null];
  const val=(m.valor==null)?'—':(m.valor+(m.unidad||''));
  let banda='';
  if(lo!=null&&hi!=null){
    // Escala hasta 1,6x el techo para que un valor por encima siga siendo visible dentro del riel.
    const max=Math.max(hi*1.6, (m.valor||0)*1.1, hi||1);
    const x=v=>Math.max(0,Math.min(100,100*v/max));
    banda=`<div class="banda"><i style="left:${x(lo)}%;width:${Math.max(2,x(hi)-x(lo))}%"></i>`+
      (m.valor!=null?`<b style="left:${x(m.valor)}%"></b>`:'')+`</div>`;
  }
  const ref=(lo!=null&&hi!=null)?`típico ${lo}–${hi}${m.unidad||''}`:'sin referencia';
  return `<div class="bmc v-${esc(m.veredicto||'sin_dato')}" title="${esc(m.nota||'')}">
    <div class="bt"><span class="dot"></span>${esc(m.etiqueta||'')}</div>
    <div class="bv">${esc(val)}</div>
    <div class="bx">${esc(m.valor==null?'sin medir todavía':ref)}</div>
    ${banda}</div>`;
}
// Las fuentes van a la vista, no escondidas: un benchmark sin origen se lee igual de convincente
// que uno inventado, y esa es justo la confusión que hay que evitar.
function fuentes(ms){
  const u=[...new Set((ms||[]).map(m=>m.fuente).filter(Boolean))];
  return u.length?`<div class="fuente">Referencias: ${u.map(esc).join(' · ')}. Son órdenes de magnitud para negocios locales, no una medición del rubro.</div>`:'';
}

function webHTML(a){
  if(!a||!a.kpis) return `<div class="sect"><span class="t">Web</span></div><div class="nodata">— Sin datos aún (el proyecto no tiene sitio cargado). —</div>`;
  const k=a.kpis;
  return `<div class="sect"><span class="t">Web</span><span class="m">${esc(k.dominio||'')} · checklist técnico ${k.checks_ok}/${k.checks_total}</span></div>
  <div class="kpis">
    ${kpi(k.score+'/100','Salud técnica','',k.score>=85?'gr':'cy')}
    ${kpi(k.checks_ok+'/'+k.checks_total,'Checks OK')}
    ${kpi(nfmt((k.recursos||{}).webp)+'/'+nfmt((k.recursos||{}).imagenes),'Imágenes en WebP')}
    ${kpi(nfmt(k.html_kb)+' KB','Peso del HTML')}
  </div>
  <div class="grid">
    <div class="card"><h3>Categorías</h3><div class="cw"><canvas id="cw-cat"></canvas></div></div>
    <div class="card"><h3>Checklist técnico</h3><div class="chk">${(k.checklist||[]).map(c=>`<div class="chk-row"><span class="d ${c.ok?'ok':'no'}"></span><span class="ct">${esc(c.cat)}</span><span>${esc(c.item)}</span><span class="dt">${esc(c.detalle||'')}</span></div>`).join('')}</div></div>
  </div>
  `;
}
function igHTML(a){
  if(!a||!a.kpis) return `<div class="sect"><span class="t">Instagram</span></div><div class="nodata">— Sin datos aún. —</div>`;
  const k=a.kpis, g=k.global||{}, cr=k.crecimiento;
  const cab=[k.followers?nfmt(k.followers)+' seguidores':'', g.posts+' posts',
             cr&&cr.alta!=null?`${cr.alta>=0?'+':''}${nfmt(cr.alta)} en ${cr.dias} días`:''].filter(Boolean).join(' · ');
  return `<div class="sect"><span class="t">Instagram</span><span class="m">${esc(cab)}</span></div>
  <div class="bm">${(k.metricas||[]).map(bmCard).join('')}</div>
  ${fuentes(k.metricas)}
  <div class="kpis">
    ${kpi(nfmt(g.reach_prom),'Alcance prom')}
    ${kpi(nfmt(g.views_prom),'Vistas prom')}
    ${kpi(nfmt(g.guard_prom),'Guardados/post')}
    ${kpi(nfmt(g.compart_prom),'Compartidos/post')}
  </div>
  ${(k.historias)
    ? `<div class="sect" style="margin-top:18px"><span class="t" style="font-size:1.1rem">Historias</span>
        <span class="m">${nfmt(k.historias.n)} medidas desde ${esc(k.historias.desde||'')}</span></div>
       <div class="kpis">
        ${kpi(nfmt(k.historias.n),'Historias medidas')}
        ${kpi(nfmt(k.historias.reach_prom),'Alcance promedio')}
        ${kpi(nfmt(k.historias.views_prom),'Vistas promedio')}
        ${kpi(nfmt(k.historias.visitas_perfil),'Visitas al perfil')}
      </div>`
    : `<div class="nodata">Historias: todavía sin capturas. ${esc(k.historias_nota||'')}</div>`}
  <div class="grid">
    <div class="card"><h3>Mes en curso, día por día</h3><div class="cw"><canvas id="c-dia"></canvas></div>
      <div class="fuente" style="margin:8px 0 0">La franja verde es el rango típico de interacción sobre alcance (1–3%).</div></div>
    <div class="card"><h3>Cadencia y alcance por mes</h3><div class="cw"><canvas id="c-cad"></canvas></div>
      <div class="fuente" style="margin:8px 0 0">La franja marca el rango típico de publicaciones (3–5 por semana, llevado a mes).</div></div>
    <div class="card"><h3>Rendimiento por formato</h3><div class="cw"><canvas id="c-fmt"></canvas></div></div>
    <div class="card"><h3>Mix de formatos</h3><div class="cw"><canvas id="c-mix"></canvas></div></div>
    <div class="card"><h3>Top posts (engag./alcance)</h3><div class="cw"><canvas id="c-top"></canvas></div></div>
  </div>
  `;
}
// La pauta: lo que se compró. Nunca se comparan avisos por alcance —eso lo define el presupuesto—,
// sino por CTR de link y CPM, que es lo único que dice qué creativo funciona.
function pautaHTML(a){
  if(!a||!a.kpis||!a.kpis.global) return '';
  const k=a.kpis, g=k.global;
  const gan=k.ganador;
  const filas=(k.avisos||[]).map(v=>`<tr>
      <td><span class="cf">CF-${String(v.numero).padStart(4,'0')}</span> ${esc(v.titulo||'')}</td>
      <td class="n">US$${(v.gasto||0).toFixed(2)}</td>
      <td class="n">${nfmt(v.impresiones)}</td>
      <td class="n">${v.ctr_link!=null?v.ctr_link+'%':'—'}</td>
      <td class="n">${v.cpm!=null?'US$'+v.cpm:'—'}</td>
    </tr>`).join('');
  return `<div class="sect"><span class="t">Pauta Meta</span><span class="m">${esc(k.periodo||'')} · US$${g.gasto} invertidos</span></div>
  <div class="bm">${(k.metricas||[]).map(bmCard).join('')}</div>
  ${fuentes(k.metricas)}
  <div class="kpis">
    ${kpi(nfmt(g.impresiones),'Impresiones')}
    ${kpi(nfmt(g.alcance),'Personas alcanzadas')}
    ${kpi(nfmt(g.clics_link),'Clics al destino')}
    ${kpi(g.costo_clic!=null?'US$'+g.costo_clic:'—','Costo por clic')}
  </div>
  ${gan?`<div class="ganador"><b>Gana CF-${String(gan.numero).padStart(4,'0')}</b> — ${esc(gan.titulo||'')}.
      ${gan.ctr}% de CTR contra ${gan.contra.ctr}% de CF-${String(gan.contra.numero).padStart(4,'0')}: ${gan.veces}× mejor.</div>`
    :`<div class="ganador sin">Todavía no hay un ganador claro entre los creativos: hace falta más volumen
      (${nfmt(k.min_impresiones_comparar)} impresiones por aviso) o una diferencia mayor para que no sea ruido.</div>`}
  <div class="card" style="margin-bottom:16px"><h3>Por aviso</h3>
    <table class="tab"><thead><tr><th>Creativo</th><th class="n">Gasto</th><th class="n">Impresiones</th>
      <th class="n">CTR link</th><th class="n">CPM</th></tr></thead><tbody>${filas}</tbody></table>
    <div class="fuente" style="margin:8px 0 0">Se comparan por CTR de link y CPM. El alcance no compara nada: lo define el presupuesto.</div>
  </div>
  `;
}

function renderWeb(a){ if(!a||!a.kpis) return; const c=a.kpis.categorias||[];
  mk('cw-cat',{type:'bar',data:{labels:c.map(x=>x.nombre),
    datasets:[{label:'% OK',data:c.map(x=>x.pct),backgroundColor:c.map(x=>x.pct>=80?GR:(x.pct>=50?GD:OR))}]},
    options:{maintainAspectRatio:false,scales:{y:{grid:GRID,min:0,max:100},x:{grid:{display:false}}},plugins:{legend:{display:false}}}}); }
function renderIg(a){ if(!a||!a.kpis) return; const k=a.kpis;
  const cad=k.cadencia||[];
  mk('c-cad',{data:{labels:cad.map(x=>x.mes),datasets:[
    {type:'bar',label:'Posts',data:cad.map(x=>x.posts),backgroundColor:'rgba(30,201,255,0.55)',yAxisID:'y'},
    {type:'line',label:'Alcance prom',data:cad.map(x=>x.reach_prom),borderColor:OR,backgroundColor:OR,tension:.3,yAxisID:'y1'}]},
    options:{maintainAspectRatio:false,scales:{y:{position:'left',grid:GRID},y1:{position:'right',grid:{display:false}},x:{grid:{display:false}}},
      // La banda es de posts POR SEMANA y el eje es mensual: se convierte, si no la referencia miente.
      plugins:{legend:{labels:{boxWidth:10}},bandaBM:(()=>{const r=rangoDe(k.metricas,'cadencia_semanal');
        return r.lo!=null?{lo:r.lo*4.3,hi:r.hi*4.3}:{};})()}}});
  const fmt=k.por_formato||[];
  mk('c-fmt',{type:'bar',data:{labels:fmt.map(x=>x.formato),datasets:[
    {label:'Alcance prom',data:fmt.map(x=>x.reach_prom),backgroundColor:CY},
    {label:'Vistas prom',data:fmt.map(x=>x.views_prom),backgroundColor:'rgba(255,119,0,0.7)'}]},
    options:{maintainAspectRatio:false,scales:{y:{grid:GRID},x:{grid:{display:false}}},plugins:{legend:{labels:{boxWidth:10}}}}});
  mk('c-mix',{type:'doughnut',data:{labels:fmt.map(x=>x.formato),datasets:[{data:fmt.map(x=>x.n),backgroundColor:[CY,OR,GR,GD]}]},
    options:{maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{boxWidth:12}}}}});
  // Mes en curso: la vista mensual no sirve con mes y medio de historia —compara un mes entero
  // de pre-apertura contra diez dias de apertura—. El detalle diario es lo que muestra la marcha.
  const dd=(k.mes&&k.mes.dia_a_dia)||[];
  if(dd.length) mk('c-dia',{data:{labels:dd.map(x=>x.fecha.slice(8)+'/'+x.fecha.slice(5,7)),datasets:[
    {type:'bar',label:'Alcance',data:dd.map(x=>x.reach),backgroundColor:'rgba(30,201,255,0.5)',yAxisID:'y'},
    {type:'line',label:'ER %',data:dd.map(x=>x.er_pct),borderColor:GR,backgroundColor:GR,tension:.3,yAxisID:'y1'}]},
    options:{maintainAspectRatio:false,
      scales:{y:{position:'left',grid:GRID},y1:{position:'right',grid:{display:false},title:{display:true,text:'ER %'}},x:{grid:{display:false}}},
      // La banda va sobre el eje del ER, que es la métrica con benchmark. El alcance no tiene.
      plugins:{legend:{labels:{boxWidth:10}},bandaBM:{...rangoDe(k.metricas,'er_alcance'),yScaleID:'y1'}}}});

  const top=k.top||[];
  mk('c-top',{type:'bar',data:{labels:top.map(x=>x.fecha+' · '+x.formato),datasets:[{label:'ER %',data:top.map(x=>x.er_pct),backgroundColor:GR}]},
    options:{indexAxis:'y',maintainAspectRatio:false,scales:{x:{grid:GRID},y:{grid:{display:false}}},plugins:{legend:{display:false}}}});
}
// ── Tablero ──────────────────────────────────────────────────────────────────────────────────
// Cuenta cuántas métricas de una sección están bien, en atención o mal. Es el resumen más honesto
// que se puede dar de un vistazo: no promedia cosas que no se promedian.
function semaforo(ms, conteo){
  const c=conteo||{bien:0,atencion:0,mal:0};
  if(!conteo) (ms||[]).forEach(m=>{ if(c[m.veredicto]!==undefined) c[m.veredicto]++; });
  const p=[];
  if(c.bien) p.push(`<i class="b"></i>${c.bien}`);
  if(c.atencion) p.push(`<i class="a"></i>${c.atencion}`);
  if(c.mal) p.push(`<i class="m"></i>${c.mal}`);
  return `<span class="sem">${p.join(' ')}</span>`;
}

function dcard(id, titulo, sub, valor, unidad, etiqueta, ms, hay, conteo){
  if(!hay) return `<button class="dcard" disabled>
    <div class="dc-top"><span class="dc-tt">${esc(titulo)}</span></div>
    <div class="dc-lab">Sin datos todavía</div></button>`;
  return `<button class="dcard" onclick="mostrar('${id}')">
    <div class="dc-top"><span class="dc-tt">${esc(titulo)}</span><span class="dc-sub">${esc(sub||'')}</span></div>
    <div class="dc-big">${esc(valor)}${unidad?`<small>${esc(unidad)}</small>`:''}</div>
    <div class="dc-lab">${esc(etiqueta)}</div>
    ${semaforo(ms, conteo)}
    <div class="dc-cw"><canvas id="d-${id}"></canvas></div>
    <div class="dc-ir">Ver el detalle →</div></button>`;
}

function dashHTML(){
  const kw=(WEB&&WEB.kpis)||null, ki=(IG&&IG.kpis)||null, kp=(PAUTA&&PAUTA.kpis)||null;
  const gi=(ki&&ki.global)||{}, gp=(kp&&kp.global)||{};
  return `<div class="dash">
    ${dcard('web','Web', kw?esc(kw.dominio||''):'', kw?kw.score:'', kw?'/100':'', 'Salud técnica',
            null, !!kw, kw?{bien:kw.checks_ok, atencion:0, mal:(kw.checks_total||0)-(kw.checks_ok||0)}:null)}
    ${dcard('instagram','Instagram', ki?(gi.posts+' posts'):'', ki?nfmt(ki.followers):'', '',
            'Seguidores', ki&&ki.metricas, !!(ki&&ki.global))}
    ${dcard('pauta','Pauta Meta', kp?('US$'+gp.gasto+' invertidos'):'',
            kp?('US$'+(gp.costo_clic!=null?gp.costo_clic:'—')):'', '',
            'Costo por visita al perfil', kp&&kp.metricas, !!(kp&&kp.global))}
  </div>`;
}

// Los gráficos del tablero son de RESUMEN: uno por sección, sin ejes ni leyenda. Su trabajo es
// mostrar la forma de la serie, no que se lean valores — para eso está el detalle.
const MINI={maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{enabled:false}},
  scales:{x:{display:false},y:{display:false}},elements:{point:{radius:0}}};
function renderDash(){
  const kw=(WEB&&WEB.kpis), ki=(IG&&IG.kpis), kp=(PAUTA&&PAUTA.kpis);
  if(kw){ const c=kw.categorias||[];
    mk('d-web',{type:'bar',data:{labels:c.map(x=>x.nombre),
      datasets:[{data:c.map(x=>x.pct!=null?x.pct:x.score),backgroundColor:CY,borderRadius:3}]},options:MINI}); }
  if(ki&&ki.global){ const cad=ki.cadencia||[];
    mk('d-instagram',{type:'bar',data:{labels:cad.map(x=>x.mes),
      datasets:[{data:cad.map(x=>x.reach_prom),backgroundColor:GR,borderRadius:3}]},options:MINI}); }
  if(kp&&kp.global){ const d=kp.por_dia||[];
    mk('d-pauta',{type:'line',data:{labels:d.map(x=>x.fecha),
      datasets:[{data:d.map(x=>x.gasto),borderColor:CY,backgroundColor:'rgba(30,201,255,.16)',
                 fill:true,tension:.3,borderWidth:2}]},options:MINI}); }
}

// ── Navegación ───────────────────────────────────────────────────────────────────────────────
// Tres niveles: tablero -> detalle de una sección -> conclusiones. Las conclusiones van detrás de
// un botón a propósito: son el cierre del informe, no la portada, y mostrarlas siempre era lo que
// hacía que la página no terminara nunca.
let VISTA='dash';
function mostrar(v){
  VISTA=v; limpiarCharts();
  const w=document.getElementById('wrap');
  if(v==='dash'){ w.innerHTML=dashHTML(); renderDash(); window.scrollTo(0,0); return; }
  const a = v==='web'?WEB : v==='instagram'?IG : PAUTA;
  const cuerpo = v==='web'?webHTML(a) : v==='instagram'?igHTML(a) : pautaHTML(a);
  const reco = (a&&a.recomendaciones)
    ? `<button class="verreco" id="b-reco" onclick="toggleReco()">Ver conclusiones y recomendaciones</button>
       <div class="reco oculto" id="caja-reco">${md(a.recomendaciones)}</div>`
    : `<div class="nodata">Esta sección todavía no tiene conclusiones escritas.</div>`;
  w.innerHTML=`<button class="volver" onclick="mostrar('dash')">← Volver al tablero</button>${cuerpo}${reco}`;
  if(v==='web') renderWeb(a); else if(v==='instagram') renderIg(a);
  window.scrollTo(0,0);
}
function toggleReco(){
  const c=document.getElementById('caja-reco'), b=document.getElementById('b-reco');
  if(!c) return;
  const abierto=!c.classList.contains('oculto');
  c.classList.toggle('oculto', abierto);
  b.textContent = abierto ? 'Ver conclusiones y recomendaciones' : 'Ocultar conclusiones';
  if(!abierto) c.scrollIntoView({behavior:'smooth',block:'start'});
}
window.mostrar=mostrar; window.toggleReco=toggleReco;

async function load(){
  try{
    const [rw,ri,rp]=await Promise.all([fetch('api/auditoria?canal=web'),
      fetch('api/auditoria?canal=instagram'), fetch('api/auditoria?canal=pauta')]);
    if(rw.status===401){location.href='login';return;}
    WEB=await rw.json(); IG=await ri.json(); PAUTA=await rp.json();
  }catch(e){}
  const w=document.getElementById('wrap');
  const fechas=[WEB&&WEB.creada_en, IG&&IG.creada_en, PAUTA&&PAUTA.creada_en].filter(Boolean).sort().pop();
  const u=document.getElementById('upd'); if(u&&fechas) u.textContent='generada '+fecha(fechas);
  if(!WEB && !IG && !PAUTA){ w.innerHTML='<div class="empty">— Todavía no hay auditoría para este proyecto. —</div>'; return; }
  mostrar(VISTA);
}
// ── Generarla ────────────────────────────────────────────────────────────────────────────────
// Tarda minutos: mide la web contra el sitio vivo, calcula la serie de Instagram y recién ahí el
// creativo escribe. Se avisa el tiempo transcurrido para que no parezca colgada.
let _poll = null, _esperando = false;
async function verEstado(){
  let e = null;
  try{ e = await fetch('api/auditoria/estado').then(r=>r.json()); }catch(_){ return; }
  const caja = document.getElementById('estado-aud'), boton = document.getElementById('b-gen');
  const corriendo = e && (e.estado === 'pendiente' || e.estado === 'procesando');
  clearInterval(_poll); _poll = null;
  if(corriendo) _poll = setInterval(verEstado, 8000);
  if(boton){ boton.disabled = !!corriendo; boton.textContent = corriendo ? 'Generando…' : 'Generar auditoría'; }
  if(!caja) return;
  if(corriendo){
    const min = Math.max(0, Math.floor((Date.now() - new Date(e.iniciado_en || e.creado_en).getTime())/60000));
    caja.innerHTML = `<div class="corriendo"><span class="sp"></span><div>
      <b>Auditando la presencia digital</b><br>
      <span class="upd">Lleva ${min === 0 ? 'menos de un minuto' : min + ' minuto' + (min===1?'':'s')} ·
      suele tardar entre 3 y 6. Podés cerrar esta ventana: sigue trabajando.</span></div></div>`;
  } else if(e && e.estado === 'error'){
    caja.innerHTML = `<div class="corriendo"><span class="malaud">${e.error||'No se pudo generar.'}</span></div>`;
  } else {
    caja.innerHTML = '';
    // Al terminar hay datos nuevos que la pantalla todavía no tiene.
    if(e && e.estado === 'lista' && _esperando){ _esperando = false; load(); }
  }
}
async function generar(){
  const boton = document.getElementById('b-gen');
  boton.disabled = true;
  try{
    const r = await fetch('api/auditoria',{method:'POST'}).then(x=>x.json());
    if(!r.ok){
      alert(r.error === 'ya_en_curso' ? 'Ya hay una auditoría en camino.' : 'No se pudo pedir la auditoría.');
      boton.disabled = false; return;
    }
    _esperando = true;
    verEstado();
  }catch(e){ boton.disabled = false; alert('Error de conexión.'); }
}
// El botón vive en el HTML, fuera del cierre: hay que exponerlo.
window.generar = generar;

load();
verEstado();
})();
</script>
<script>
// Red aparte del script de arriba, a propósito: si aquél no llega ni a parsear, este igual corre.
// Una pantalla clavada en "Cargando…" para siempre no le dice a nadie que algo se rompió.
setTimeout(() => {
  const w = document.getElementById('wrap');
  if (w && /Cargando auditoría/.test(w.textContent)) {
    w.innerHTML = '<div class="empty">Esta pantalla no pudo cargar. ' +
      '<a onclick="location.reload()" style="cursor:pointer;text-decoration:underline">Recargar</a>' +
      ' — si sigue igual, avisá: es un error de la página, no de tus datos.</div>';
  }
}, 8000);
</script>
