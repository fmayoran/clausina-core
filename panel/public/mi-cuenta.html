<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClaUsina — Mi cuenta</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="fonts/clausina-icono-180.png">
<script>try{if(localStorage.getItem('clausina-mode')!=='light')document.documentElement.classList.add('dark');}catch(e){document.documentElement.classList.add('dark');}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Inter:wght@400;450;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tw.css">
<style>
  /* Variables locales espejadas de los tokens del sistema (tw.css), para que el modal, los
     inputs y los botones sigan el tema claro/oscuro como el resto del panel. Antes estaban
     hardcodeados en hex y en modo claro quedaban fuera de la paleta: el acento del sistema en
     claro es verde oliva (#4d6800), no el lima, que sólo funciona sobre fondo oscuro. */
  :root{--u-surf:#FFFFFF;--u-bg:#F7F5F1;--u-line:#DEDDD3;--u-fg:#0c0c0a;--u-mut:#5A616A;
        --u-acc:#4d6800;--u-accfg:#FFFFFF;--u-ok:#4d6800;--u-mal:#C4442A;--u-medio:#8A6410;}
  .dark{--u-surf:#12151A;--u-bg:#0c0c0a;--u-line:#20242B;--u-fg:#F5F2EC;--u-mut:#8A8F98;
        --u-acc:#CCF24D;--u-accfg:#0c0c0a;--u-ok:#7BC96F;--u-mal:#FF6B4A;--u-medio:#E8A33D;}
  label{display:block;font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--u-mut);margin:18px 0 6px;}
  input{width:100%;background:var(--u-bg);border:1px solid var(--u-line);border-radius:8px;padding:10px 12px;font-family:'Inter',sans-serif;font-size:1rem;color:var(--u-fg);outline:none;}
  input:focus{border-color:var(--u-acc);}
  input:disabled{opacity:.55;cursor:not-allowed;}
  .ayuda{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--u-mut);margin-top:5px;text-transform:none;letter-spacing:0;}
  .btn{background:var(--u-acc);color:var(--u-accfg);border:none;border-radius:8px;font-weight:700;padding:11px 22px;cursor:pointer;font-family:'Inter Tight',sans-serif;font-size:1rem;margin-top:24px;}
  .btn:disabled{opacity:.5;cursor:default;}
  .msg{font-family:'JetBrains Mono',monospace;font-size:.7rem;margin-top:14px;min-height:1.1em;}
  .msg.mal{color:var(--u-mal);} .msg.bien{color:var(--u-ok);}
  .caja{max-width:520px;}
  .pwrap{position:relative;}
  .pwrap input{padding-right:42px;}
  .pojo{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:grid;place-items:center;
        width:30px;height:30px;border:none;background:none;color:var(--u-mut);cursor:pointer;border-radius:6px;}
  .pojo:hover{color:var(--u-fg);}
  .pwmsg{font-family:'JetBrains Mono',monospace;font-size:.66rem;margin-top:8px;min-height:1.1em;}
  .pwmsg.mal{color:var(--u-mal);} .pwmsg.bien{color:var(--u-ok);}
  #bloque-pw{border-top:1px solid var(--u-line) !important;}
</style>
</head>
<body class="bg-paper text-pfg dark:bg-ink dark:text-fg transition-colors">
<div class="shell">
  <main class="px-6 md:px-9 py-8 min-w-0">
    <div class="caja">
      <h1 class="display font-bold text-xl tracking-tight" id="tit">Mi cuenta</h1>
      <p class="mono text-[11px] text-pmut dark:text-mut mt-2 mb-1" id="bajada">
        Tus datos de contacto.
      </p>

      <label for="f-nombre">Nombre</label>
      <input type="text" id="f-nombre" autocomplete="name">

      <label for="f-email">Email</label>
      <input type="email" id="f-email" disabled>
      <div class="ayuda">Es con el que entrás. No se cambia desde acá.</div>

      <label for="f-wa">WhatsApp</label>
      <input type="text" id="f-wa" placeholder="+54 9 11 5555 5555" autocomplete="tel" oninput="ecoTel()">
      <div class="ayuda" id="wa-eco">Por acá te vamos a avisar cuando haya algo para que apruebes.</div>

      <label for="f-cargo">Tu rol en el negocio <span style="text-transform:none;letter-spacing:0">(opcional)</span></label>
      <input type="text" id="f-cargo" placeholder="Dueño, encargada, marketing…" autocomplete="off">

      <button class="btn" id="btn" onclick="guardar()">Guardar</button>
      <div class="msg" id="msg"></div>

      <!-- Entrar con Google es cómodo, pero no obligatorio: el que prefiera una contraseña
           la define acá y a partir de ahí tiene las dos puertas. -->
      <div id="bloque-pw" style="margin-top:44px;padding-top:28px;border-top:1px solid #E6E3DD;">
        <h2 class="display font-bold text-base tracking-tight">Contraseña</h2>
        <p class="mono text-[11px] text-pmut dark:text-mut mt-2" id="pw-estado"></p>

        <div id="pw-actual-box">
          <label for="p-actual">Contraseña actual</label>
          <div class="pwrap"><input type="password" id="p-actual" autocomplete="current-password"></div>
        </div>

        <label for="p-nueva">Contraseña nueva</label>
        <div class="pwrap">
          <input type="password" id="p-nueva" autocomplete="new-password" placeholder="mínimo 8 caracteres" oninput="chequearPw()">
          <button type="button" class="pojo" onclick="verPw()" id="pw-ojo" title="Mostrar u ocultar" aria-label="Mostrar u ocultar">
            <i data-lucide="eye" class="w-4 h-4"></i>
          </button>
        </div>
        <label for="p-nueva2">Repetir la nueva</label>
        <div class="pwrap"><input type="password" id="p-nueva2" autocomplete="new-password" oninput="chequearPw()"></div>
        <div class="pwmsg" id="pw-msg"></div>

        <button class="btn" id="btn-pw" onclick="guardarPw()">Guardar contraseña</button>
        <div class="msg" id="msg-pw"></div>
      </div>
    </div>
  </main>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="shell.js?v=20260902b"></script>
<script>ClausinaShell({active:'micuenta'})</script>
<script>
let PRIMERA = false, TIENE_PW = false;

async function cargar(){
  try{
    const yo = await fetch('api/yo').then(r=>r.json());
    document.getElementById('f-nombre').value = yo.nombre || '';
    document.getElementById('f-email').value  = yo.email || '';
    document.getElementById('f-wa').value     = yo.whatsapp || '';
    document.getElementById('f-cargo').value  = yo.cargo || '';
    PRIMERA = !yo.perfil_completo;
    // Si nunca definió una, no le pedimos la actual: entró con Google y no tiene.
    TIENE_PW = !!yo.tiene_password;
    document.getElementById('pw-actual-box').style.display = TIENE_PW ? '' : 'none';
    document.getElementById('pw-estado').textContent = TIENE_PW
      ? 'Podés entrar con Google o con tu contraseña. Acá la cambiás.'
      : 'Hoy entrás con Google. Si preferís, definí una contraseña y vas a poder usar las dos.';
    if(PRIMERA){
      // Primer ingreso: explicamos por qué lo frenamos acá antes de dejarlo pasar.
      document.getElementById('tit').textContent = `Bienvenido, ${(yo.nombre||'').split(' ')[0]}`;
      document.getElementById('bajada').innerHTML =
        'Antes de empezar, completá un par de datos. Es la única vez que te los pedimos.';
    }
  }catch(_){ document.getElementById('msg').className='msg mal';
             document.getElementById('msg').textContent='No se pudieron cargar tus datos.'; }
}

async function guardar(){
  const m = document.getElementById('msg'), btn = document.getElementById('btn');
  m.className='msg'; m.textContent=''; btn.disabled=true;
  const body = {
    nombre:   document.getElementById('f-nombre').value.trim(),
    whatsapp: document.getElementById('f-wa').value.trim(),
    cargo:    document.getElementById('f-cargo').value.trim(),
  };
  try{
    const r = await fetch('api/mi-cuenta', {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d = await r.json().catch(()=>({}));
    if(!r.ok){ m.className='msg mal'; m.textContent = d.mensaje || 'No se pudo guardar.'; btn.disabled=false; return; }
    m.className='msg bien'; m.textContent='Guardado.';
    // Recién completado el perfil, lo soltamos al panel.
    if(PRIMERA) setTimeout(()=>{ location.href='proyecto'; }, 700);
  }catch(_){ m.className='msg mal'; m.textContent='Error de conexión.'; }
  btn.disabled=false;
}

/* Le mostramos cómo queda interpretado el número: si el parseo sale mal, lo ve antes de
   guardar en vez de descubrirlo el día que un mensaje suyo rebote sin explicación. */
let _ecoT=null;
function ecoTel(){
  clearTimeout(_ecoT);
  _ecoT = setTimeout(async ()=>{
    const v=document.getElementById('f-wa').value.trim();
    const e=document.getElementById('wa-eco');
    if(!v){ e.textContent='Por acá te vamos a avisar cuando haya algo para que apruebes.'; e.style.color=''; return; }
    try{
      const d=await fetch('api/telefono/eco?v='+encodeURIComponent(v)).then(r=>r.json());
      if(!d.ok){ e.textContent='No parece un número válido.'; e.style.color='var(--u-mal)'; }
      else if(d.en_uso){ e.textContent='Ese número ya está cargado en otra cuenta.'; e.style.color='var(--u-mal)'; }
      else { e.textContent=`Lo vamos a usar como ${d.lindo}`; e.style.color=''; }
    }catch(_){}
  }, 350);
}

function verPw(){
  const a=document.getElementById('p-nueva'), b=document.getElementById('p-nueva2');
  const oculto = a.type==='password';
  a.type=b.type = oculto ? 'text' : 'password';
  document.getElementById('pw-ojo').innerHTML =
    `<i data-lucide="${oculto?'eye-off':'eye'}" class="w-4 h-4"></i>`;
  if(window.lucide) lucide.createIcons();
}

function chequearPw(){
  const a=document.getElementById('p-nueva').value, b=document.getElementById('p-nueva2').value;
  const m=document.getElementById('pw-msg'); m.className='pwmsg';
  if(!a && !b){ m.textContent=''; return true; }
  if(a.length<8){ m.classList.add('mal'); m.textContent=`Faltan ${8-a.length} caracteres.`; return false; }
  if(!b){ m.classList.add('mal'); m.textContent='Repetila para confirmar.'; return false; }
  if(a!==b){ m.classList.add('mal'); m.textContent='No coinciden.'; return false; }
  m.classList.add('bien'); m.textContent='Coinciden.'; return true;
}

async function guardarPw(){
  const m=document.getElementById('msg-pw'), btn=document.getElementById('btn-pw');
  m.className='msg'; m.textContent='';
  const nueva=document.getElementById('p-nueva').value;
  if(!nueva){ m.className='msg mal'; m.textContent='Escribí la contraseña nueva.'; return; }
  if(!chequearPw()){ m.className='msg mal'; m.textContent='Revisá la contraseña.'; return; }
  btn.disabled=true;
  try{
    const r=await fetch('api/mi-cuenta/password',{method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({actual:document.getElementById('p-actual').value, nueva})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){ m.className='msg mal'; m.textContent=d.mensaje||'No se pudo guardar.'; btn.disabled=false; return; }
    m.className='msg bien'; m.textContent='Contraseña guardada. Ya podés entrar con ella.';
    ['p-actual','p-nueva','p-nueva2'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('pw-msg').textContent='';
    TIENE_PW = true;
    document.getElementById('pw-actual-box').style.display='';
    document.getElementById('pw-estado').textContent='Podés entrar con Google o con tu contraseña. Acá la cambiás.';
  }catch(_){ m.className='msg mal'; m.textContent='Error de conexión.'; }
  btn.disabled=false;
}

cargar();
</script>
</body>
</html>
