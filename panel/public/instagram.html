<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cortafuego — Instagram</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Inter:wght@400;450;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem('clausina-mode')!=='light')document.documentElement.classList.add('dark');}catch(e){document.documentElement.classList.add('dark');}</script>
<link rel="stylesheet" href="tw.css">
<link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <a class="logo" href=".">CORTA<b>FUEGO</b></a>
    <span class="sub">Instagram</span>
    <span class="upd" id="upd"></span>
    <nav>
      <a href="proyecto">← Proyecto</a>
      <button class="logout" onclick="salir()">Salir</button>
    </nav>
  </header>
<div class="shell"><main class="min-w-0">
  <div id="toast"></div>
  <div class="pgacts">
    <button class="ibtn destacado" onclick="PedirCreativo.abrir({canal:'instagram'})"
      title="Contale al creativo qué querés lograr y que proponga publicaciones"><i data-lucide="sparkles" class="w-4 h-4"></i>Pedirle al creativo</button>
    <button class="ibtn" onclick="cfgIG(true)" title="Configurar la cuenta de Instagram"><i data-lucide="settings-2" class="w-4 h-4"></i>Configurar</button></div>
  <div class="board b2">
    <div class="col pend"><h2><span class="dot"></span>Pendiente de aprobación <span class="n" id="n-pend"></span></h2><div class="cards" id="c-pend"></div></div>
    <div class="col pub"><h2><span class="dot"></span>Publicada <span class="n" id="n-pub"></span></h2><div class="cards" id="c-pub"></div></div>
  </div>

  <!-- Configuración de la capacidad: antes vivía en Perfil > Redes (v2.0/F2). -->
  <div id="cfgmodal" class="modal hidden">
    <div class="modal-bg" onclick="cfgIG(false)"></div>
    <div class="modal-box">
      <div class="modal-head"><div class="modal-tt">Cuenta de Instagram</div><button class="modal-x" onclick="cfgIG(false)" title="Cerrar">×</button></div>
      <div class="modal-body">
        <div class="cfgfld"><label>Cuenta <span class="cfghint">— con @</span></label><input type="text" id="ig_handle" placeholder="@cuenta"></div>
        <div class="cfgfld"><label>IG User ID</label><input type="text" id="ig_user_id"></div>
        <div class="cfgfld"><label>Token de Instagram <span class="cfghint">— se guarda cifrado; no se muestra</span></label><input type="password" id="ig_token" autocomplete="off"></div>
      </div>
      <div class="modal-foot"><button class="ibtn prim" onclick="cfgIGGuardar()">Guardar</button><button class="ibtn ghost" onclick="cfgIG(false)">Cerrar</button></div>
    </div>
  </div>
</main></div>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="shell.js"></script>
<script>ClausinaShell({active:'instagram',cap:'instagram'});</script>
<script src="panel.js"></script>
<script src="pedir-creativo.js"></script>
<script>PedirCreativo.arrancar({canal:'instagram'});</script>
<script>
currentLoad=loadInstagram; loadInstagram(); setInterval(loadInstagram,6000);
const IG_IDS=['ig_handle','ig_user_id'];
const IG_TOKENS=[{id:'ig_token',flag:'ig_token_set',campo:'ig_token'}];
function cfgIG(abrir){
  const m=document.getElementById('cfgmodal');
  m.classList.toggle('hidden',!abrir);
  if(abrir) cfgCargar(IG_IDS, IG_TOKENS);
}
async function cfgIGGuardar(){ if(await cfgGuardar(IG_IDS, IG_TOKENS)) cfgIG(false); }
</script>
</body>
</html>
